common:
  tags:
    - drivers
    - mspi
    - ci_tests_drivers_hpf
    - ppk_power_measure
  harness: pytest
  harness_config:
    fixture: ppk_power_measure
    pytest_root:
      - "${CUSTOM_ROOT_TEST_DIR}/test_measure_power_consumption.py::test_measure_and_data_dump_flpr_idle"
tests:
  benchmarks.current_consumption.hpf_mspi_flash:
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    extra_args:
      - hpf_mspi_CONFIG_HPF_MSPI_FAULT_TIMER=n
      - CONFIG_MSPI_HPF_FAULT_TIMER=n
