common:
  tags:
    - ci_tests_benchmarks_current_consumption
    - ppk_power_measure
  depends_on: gpio
  harness: pytest
  harness_config:
    fixture: gpio_loopback
    pytest_root:
      - "${CUSTOM_ROOT_TEST_DIR}/test_measure_power_consumption.py::test_current_consumption_hpf_gpio_idle"
  platform_allow:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf54lv10dk/nrf54lv10a/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuapp
  integration_platforms:
    - nrf54l15dk/nrf54l15/cpuapp
  sysbuild: true

tests:
  benchmarks.current_consumption.hpf_gpio_idle.icmsg:
    extra_args: SB_CONFIG_HPF_GPIO_BACKEND_ICMSG=y

  benchmarks.current_consumption.hpf_gpio_idle.icbmsg:
    extra_args: SB_CONFIG_HPF_GPIO_BACKEND_ICBMSG=y

  benchmarks.current_consumption.hpf_gpio_idle.mbox:
    extra_args: SB_CONFIG_HPF_GPIO_BACKEND_MBOX=y
