# The Zephyr CMSIS emulation assumes that ticks are ms, currently
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Enable logging. All of the output comes from the runner thread: the operation
# threads are silent by design.
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Thread names identify an operation in the summary and in a fault message.
# Long enough for
# "<alg>/<keydesc>/<stage>/<operation>".
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=128

# Per-operation stack usage. INIT_STACKS also means that every
# k_thread_create() re-poisons the shared operation stack, so each operation is
# measured from a clean slate.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Per-operation timing, at CPU cycle resolution.
CONFIG_TIMING_FUNCTIONS=y

# An operation that overflows its stack cannot report it. Make that a fault
# attributed to the named thread rather than silent corruption.
CONFIG_HW_STACK_PROTECTION=y

# Enable cryptographic features
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# Mbed TLS heap configuration
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_PSA_CRYPTO_DRIVER_OBERON=n
