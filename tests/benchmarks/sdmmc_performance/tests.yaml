common:
  tags:
    - drivers
    - ci_tests_benchmarks_sdmmc_performance

tests:
  benchmarks.sd_mmc.performance.semmc:
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - CONFIG_MMC_STACK=y
      - FILE_SUFFIX=semmc
    harness: console
    harness_config:
      fixture: semmc
      ordered: true
      type: multi_line
      regex:
        - "SDCARD/eMMC performance benchmark"
        - "Done"
