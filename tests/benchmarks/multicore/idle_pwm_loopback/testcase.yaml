common:
  sysbuild: true
  tags:
    - ci_build
    - ci_tests_benchmarks_multicore

tests:
  benchmarks.multicore.idle_pwm_loopback.nrf54h20dk_cpuapp_cpurad.no_sleep:
    filter: not CONFIG_COVERAGE
    extra_args:
      - idle_pwm_loopback_EXTRA_CONF_FILE=enable_logs.conf
      - remote_EXTRA_CONF_FILE=enable_logs.conf
    harness: console
    harness_config:
      fixture: spi_loopback
      type: multi_line
      ordered: true
      regex:
        - "Multicore idle_pwm_loopback test on"
        - "Iteration 0"
        - "Iteration 1"
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp

  benchmarks.multicore.idle_pwm_loopback.nrf54h20dk_cpuapp_cpurad.idle_retained:
    filter: not CONFIG_COVERAGE
    tags: ppk_power_measure
    extra_args:
      - idle_pwm_loopback_CONFIG_TEST_SLEEP_DURATION_MS=500
      - remote_CONFIG_TEST_SLEEP_DURATION_MS=500
      - idle_pwm_loopback_EXTRA_DTC_OVERLAY_FILE="${ZEPHYR_NRF_MODULE_DIR}/tests/benchmarks/multicore/common/workaround_idle_retained.overlay"
    harness: pytest
    harness_config:
      fixture: spi_loopback
      pytest_root:
        - "${CUSTOM_ROOT_TEST_DIR}/test_measure_power_consumption.py::test_measure_and_data_dump_pwm_and_idle"
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp

  benchmarks.multicore.idle_pwm_loopback.nrf54h20dk_cpuapp_cpurad.idle:
    filter: not CONFIG_COVERAGE
    tags: ppk_power_measure
    extra_args:
      - idle_pwm_loopback_CONFIG_TEST_SLEEP_DURATION_MS=500
      - remote_CONFIG_TEST_SLEEP_DURATION_MS=500
      - idle_pwm_loopback_EXTRA_DTC_OVERLAY_FILE="${ZEPHYR_NRF_MODULE_DIR}/tests/benchmarks/multicore/common/workaround_idle.overlay"
    harness: pytest
    harness_config:
      fixture: spi_loopback
      pytest_root:
        - "${CUSTOM_ROOT_TEST_DIR}/test_measure_power_consumption.py::test_measure_and_data_dump_pwm_and_idle"
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp

  benchmarks.multicore.idle_pwm_loopback.nrf54h20dk_cpuapp_cpurad.s2ram:
