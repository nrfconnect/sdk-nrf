common:
  tags:
    - drivers
    - uart
    - ci_tests_zephyr_drivers_uart
  timeout: 120
  harness: ztest
  harness_config:
    fixture: uart_loopback
  sysbuild: true
tests:
  nrf.extended.drivers.uart.async_dual:
    platform_allow: &platform_allow_common
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms: &integration_platforms_common
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
  nrf.extended.drivers.uart.async_dual.busy_sim:
    platform_allow: *platform_allow_common
    integration_platforms: *integration_platforms_common
    extra_configs:
      - CONFIG_TEST_BUSY_SIM=y
  nrf.extended.drivers.uart.async_dual.pm_runtime:
    platform_allow: *platform_allow_common
    integration_platforms: *integration_platforms_common
    extra_configs:
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_PM_DEVICE=y
  nrf.extended.drivers.uart.async_dual.pm_runtime.busy_sim:
    platform_allow: *platform_allow_common
    integration_platforms: *integration_platforms_common
    extra_configs:
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_PM_DEVICE=y
      - CONFIG_TEST_BUSY_SIM=y
  nrf.extended.drivers.uart.async_dual.pm_runtime.explicit:
    platform_allow: *platform_allow_common
    integration_platforms: *integration_platforms_common
    extra_configs:
      - CONFIG_PM_RUNTIME_IN_TEST=y
  nrf.extended.drivers.uart.async_dual.no_tx_chopped:
    platform_allow: *platform_allow_common
    integration_platforms: *integration_platforms_common
    extra_configs:
      - CONFIG_TEST_CHOPPED_TX=n
      - CONFIG_UARTE_NRFX_UARTE_COUNT_BYTES_WITH_TIMER=n
      - CONFIG_UARTE_NRFX_UARTE_COUNT_BYTES_WITH_TIMER_LEGACY=n
      - CONFIG_UART_1_NRF_HW_ASYNC=n
  nrf.extended.drivers.uart.async_dual.ppr.9251:
    platform_allow: &platform_nrf92_ppr
      - nrf9251dk/nrf9251/cpuppr
    integration_platforms: *platform_nrf92_ppr
    extra_configs:
      - CONFIG_IPC_SERVICE=y
      - CONFIG_MBOX=y
      - CONFIG_GPPI_EXT_ALLOCATOR_CLI=y
  nrf.extended.drivers.uart.async_dual.busy_sim.ppr.9251:
    platform_allow: *platform_nrf92_ppr
    integration_platforms: *platform_nrf92_ppr
    extra_configs:
      - CONFIG_IPC_SERVICE=y
      - CONFIG_MBOX=y
      - CONFIG_GPPI_EXT_ALLOCATOR_CLI=y
      - CONFIG_TEST_BUSY_SIM=y
  nrf.extended.drivers.uart.async_dual.pm_runtime.ppr.9251:
    platform_allow: *platform_nrf92_ppr
    integration_platforms: *platform_nrf92_ppr
    extra_configs:
      - CONFIG_IPC_SERVICE=y
      - CONFIG_MBOX=y
      - CONFIG_GPPI_EXT_ALLOCATOR_CLI=y
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_PM_DEVICE=y
  nrf.extended.drivers.uart.async_dual.pm_runtime.busy_sim.ppr.9251:
    platform_allow: *platform_nrf92_ppr
    integration_platforms: *platform_nrf92_ppr
    extra_configs:
      - CONFIG_IPC_SERVICE=y
      - CONFIG_MBOX=y
      - CONFIG_GPPI_EXT_ALLOCATOR_CLI=y
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_PM_DEVICE=y
      - CONFIG_TEST_BUSY_SIM=y
  nrf.extended.drivers.uart.async_dual.pm_runtime.explicit.ppr.9251:
    platform_allow: *platform_nrf92_ppr
    integration_platforms: *platform_nrf92_ppr
    extra_configs:
      - CONFIG_IPC_SERVICE=y
      - CONFIG_MBOX=y
      - CONFIG_GPPI_EXT_ALLOCATOR_CLI=y
      - CONFIG_PM_RUNTIME_IN_TEST=y
  nrf.extended.drivers.uart.async_dual.no_tx_chopped.ppr.9251:
    platform_allow: *platform_nrf92_ppr
    integration_platforms: *platform_nrf92_ppr
    extra_configs:
      - CONFIG_IPC_SERVICE=y
      - CONFIG_MBOX=y
      - CONFIG_GPPI_EXT_ALLOCATOR_CLI=y
      - CONFIG_TEST_CHOPPED_TX=n
      - CONFIG_UARTE_NRFX_UARTE_COUNT_BYTES_WITH_TIMER=n
      - CONFIG_UARTE_NRFX_UARTE_COUNT_BYTES_WITH_TIMER_LEGACY=n
      - CONFIG_UART_1_NRF_HW_ASYNC=n
