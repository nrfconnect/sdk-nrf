common:
  tags:
    - drivers
    - uart
    - ci_tests_zephyr_drivers_uart
  depends_on: gpio
  harness: ztest
  harness_config:
    fixture: gpio_loopback
  timeout: 30
  filter: CONFIG_SERIAL_SUPPORT_INTERRUPT
  platform_allow:
    - nrf54ls05dk/nrf54ls05a/cpuapp
    - nrf54ls05dk/nrf54ls05b/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuflpr
    - nrf9251dk/nrf9251/cpuapp
    - nrf9251dk/nrf9251/cpuflpr
    - nrf9251dk/nrf9251/cpuppr
    - nrf7120dk/nrf7120/cpuapp/ns
    - nrf7120dk/nrf7120e/cpuapp
  integration_platforms:
    - nrf54ls05dk/nrf54ls05b/cpuapp

tests:
  nrf.extended.drivers.uart.uart_elementary: {}

  nrf.extended.drivers.uart.uart_elementary_dual:
    platform_exclude:
      - nrf9251dk/nrf9251/cpuflpr
    extra_args:
      - FILE_SUFFIX="dual_uart"
    extra_configs:
      - CONFIG_DUAL_UART_TEST=y

  nrf.extended.drivers.uart.uart_elementary_dual_setup_mismatch:
    platform_exclude:
      - nrf9251dk/nrf9251/cpuflpr
    extra_args:
      - FILE_SUFFIX="dual_uart"
    extra_configs:
      - CONFIG_DUAL_UART_TEST=y
      - CONFIG_SETUP_MISMATCH_TEST=y

  nrf.extended.drivers.uart.uart_elementary_dual.pm:
    platform_exclude:
      - nrf9251dk/nrf9251/cpuflpr
    extra_args:
      - FILE_SUFFIX="dual_uart"
    extra_configs:
      - CONFIG_DUAL_UART_TEST=y
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
