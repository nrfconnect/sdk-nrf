CONFIG_ZTEST=y
CONFIG_ZTEST_MOCKING=y
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_ZTEST_PARAMETER_COUNT=64

CONFIG_PSA_CRYPTO=y


# Avoid the creation of a flash.bin file when running (all paths to flash are
# mocked anyways so this doesn't affect any behavior).
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="-flash_in_ram"
