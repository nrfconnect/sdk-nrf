common:
  sysbuild: true
  tags:
    - event_manager_proxy
    - sysbuild
    - ci_tests_subsys_event_manager_proxy

tests:
  event_manager_proxy.event_manager_proxy:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - platform:nrf54h20:event_manager_proxy_SNIPPET=nordic-ppr
      - platform:nrf9251:event_manager_proxy_SNIPPET=nordic-ppr
      - platform:nrf54l:event_manager_proxy_SNIPPET=nordic-flpr
      - platform:nrf7120:event_manager_proxy_SNIPPET=nordic-flpr
    timeout: 20
