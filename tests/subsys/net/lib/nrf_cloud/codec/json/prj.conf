# ZTEST with new API
CONFIG_ZTEST=y

# Network (required by nrf_cloud headers)
CONFIG_NETWORKING=y

# Disable sockets (not needed for codec unit tests)
CONFIG_NET_SOCKETS=n

# cJSON library (required by nrf_cloud_codec.c)
CONFIG_CJSON_LIB=y

# C library with float printf support (required by cJSON)
# Ineffective here: PICOLIBC wins this choice, so NEWLIB_LIBC cannot be selected.
# CONFIG_NEWLIB_LIBC=y
# Ineffective here: unsatisfied dependency NEWLIB_LIBC, so NEWLIB_LIBC_FLOAT_PRINTF stays n.
# CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
