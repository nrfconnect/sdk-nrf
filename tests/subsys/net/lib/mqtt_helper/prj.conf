CONFIG_UNITY=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ASSERT=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
# Needed to disable Ethernet auto-start at boot through net_if_up(), which
# triggers CMock and causes unexpected calls.
CONFIG_ETH_NET_IF_NO_AUTO_START=y

# Every socket and net_if call is mocked, so no network device is needed. This
# keeps out the QEMU SLIP driver and the Ethernet-sized packet pools, which do
# not fit in the 64 kB RAM of qemu_cortex_m3 next to CMock's 32 kB arena.
CONFIG_NET_TEST=y
CONFIG_NET_PKT_RX_COUNT=1
CONFIG_NET_PKT_TX_COUNT=1
CONFIG_NET_BUF_RX_COUNT=1
CONFIG_NET_BUF_TX_COUNT=1
CONFIG_NET_TC_RX_COUNT=0
