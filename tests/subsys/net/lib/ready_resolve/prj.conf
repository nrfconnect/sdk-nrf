CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
# Suites are selected by readiness configuration
CONFIG_ZTEST_VERIFY_RUN_ALL=n

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_READY_RESOLVE=y

CONFIG_LOG=y
CONFIG_READY_RESOLVE_LOG_LEVEL_DBG=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_DRIVER=n
