# DECT IPv6 tether integration test (native_sim + mocked modem)

CONFIG_ZTEST=y
CONFIG_UNITY=y
CONFIG_TEST=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_INFO_DEFAULT_DATA_SIZE=224

CONFIG_NET_L2_DECT=y
CONFIG_NET_L2_DECT_MGMT=y
CONFIG_NET_L2_DECT_BR=n
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_ETH_DRIVER=n

CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y

CONFIG_NET_ROUTING=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IPV6_MLD=y

CONFIG_DECT=y
CONFIG_DECT_MDM=y
CONFIG_DECT_MDM_DRIVER_NRF=y
CONFIG_DECT_CLUSTER_MAX_CHILD_ASSOCIATION_COUNT=8
CONFIG_DECT_MDM_DEVICE_NAME="dect_test"
CONFIG_DECT_MDM_NET_IF_NO_AUTO_START=n

CONFIG_NET_L2_DECT_ULA=y
CONFIG_NET_L2_DECT_ULA_PREFIX="fdde:ad00:0000::"

CONFIG_DECT_TETHER_IPV6_LIB=y
CONFIG_DECT_TETHER_IPV6_RA=y
CONFIG_DECT_TETHER_IPV6_DHCPV6_SERVER=y
CONFIG_DECT_TETHER_IPV6_RA_PREFIX_INFO=y
CONFIG_DECT_TETHER_IPV6_RA_RDNSS=y
CONFIG_DECT_TETHER_IPV6_RA_MANAGED=y
CONFIG_DECT_TETHER_IPV6_RA_UNSOLICIT_MS=0
CONFIG_DECT_TETHER_IPV6_MDNS_FORWARD=n

CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_INTERFACE_NAME_LEN=15
CONFIG_DECT_TETHER_IPV6_HOST_ETH_IFACE="eth0"

CONFIG_NET_IF_MAX_IPV6_COUNT=4
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=10
CONFIG_NET_IF_IPV6_PREFIX_COUNT=4
CONFIG_NET_IPV6_MAX_NEIGHBORS=12

CONFIG_NET_BUF=y
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=24

CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NEWLIB_LIBC=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_MODEM_CELLULAR=n
CONFIG_MODEM_ANTENNA=n
CONFIG_MODEM_INFO=n
CONFIG_MBEDTLS=n
