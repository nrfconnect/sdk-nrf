#
# Same as ../client/prj.conf but CONFIG_DECT_NR_RPC_AUTO_SYNC=y for notify hook test.
#

CONFIG_ZTEST=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_DECT=y
CONFIG_DECT_CLUSTER_MAX_CHILD_ASSOCIATION_COUNT=16

CONFIG_DECT_NR_RPC=y
CONFIG_DECT_NR_RPC_CLIENT=y
CONFIG_DECT_NR_RPC_NET_IF=y
CONFIG_DECT_NR_RPC_CLIENT_IFACE_NAME="dect0"
CONFIG_DECT_NR_RPC_CLIENT_SHELL=y
CONFIG_DECT_NR_RPC_CLIENT_SHELL_RPC_INIT=n
CONFIG_DECT_NR_RPC_CONN_MGR=y

CONFIG_DECT_NR_RPC_AUTO_SYNC=y
CONFIG_DECT_NR_RPC_AUTO_SYNC_DELAY_SEC=0
CONFIG_DECT_NR_RPC_ADDR_SYNC_INTERVAL_SEC=0
CONFIG_DECT_NR_RPC_MAX_IP_PKT=500

CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_ZCBOR_BACKUPS=1
CONFIG_NRF_RPC_CBKPROXY_OUT_SLOTS=0
CONFIG_NRF_RPC_THREAD_STACK_SIZE=4096
CONFIG_NRF_RPC_THREAD_PRIORITY=0
CONFIG_NRF_RPC_RESPONSE_TIMEOUT=400

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2048
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_MAX_CONN=6

CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
CONFIG_NET_IF_MAX_IPV6_COUNT=8
CONFIG_NET_INTERFACE_NAME=y

CONFIG_ZVFS_POLL_MAX=10

CONFIG_NET_BUF=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=8

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_NET_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=4096

CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n

CONFIG_MOCK_NRF_RPC=y
CONFIG_MOCK_DECT_RPC_TRANSPORT=y
CONFIG_NRF_RPC_GROUP_DEFAULT_INITIATOR=y

CONFIG_KERNEL_MEM_POOL=y
CONFIG_ASAN=y
CONFIG_ZTEST_STACK_SIZE=2560
CONFIG_MAIN_STACK_SIZE=2048
