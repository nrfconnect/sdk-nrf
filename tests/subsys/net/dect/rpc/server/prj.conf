# DECT NR+ RPC server unit test (native_sim): DECT_MDM arch + mock driver, real l2_dect,
# RPC server, mocked nRF RPC transport.

CONFIG_ZTEST=y
CONFIG_TEST=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_DECT=y
CONFIG_DECT_MDM=y
CONFIG_DECT_MDM_DRIVER_MOCK=y
CONFIG_DECT_CLUSTER_MAX_CHILD_ASSOCIATION_COUNT=16

CONFIG_DECT_NR_RPC=y
CONFIG_DECT_NR_RPC_SERVER=y
CONFIG_DECT_NR_RPC_NET_IF=y
CONFIG_DECT_NR_RPC_SHELL=y
CONFIG_DECT_NR_RPC_MAX_IP_PKT=500
CONFIG_DECT_NR_RPC_SERVER_EVT_PACING_MS=0

CONFIG_GETOPT_LONG=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_POLL_MAX=10

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# RPC init is via nrf_rpc_init() in tc_setup(); not the dect_rpc_init shell (sample uses main()).
CONFIG_DECT_NR_RPC_SERVER_SHELL_RPC_INIT=n

CONFIG_MOCK_NRF_RPC=y
CONFIG_MOCK_DECT_RPC_TRANSPORT=y

CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_ZCBOR_BACKUPS=1
CONFIG_NRF_RPC_CBKPROXY_OUT_SLOTS=0
CONFIG_NRF_RPC_RESPONSE_TIMEOUT=50

CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_INFO_DEFAULT_DATA_SIZE=224
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_L2_DECT_CONN_MGR=y
# Deterministic tests: fixture activates explicitly; RPC connect drives join.
CONFIG_NET_L2_DECT_CONN_MGR_AUTO_CONNECT=n

CONFIG_NET_IF_MAX_IPV6_COUNT=4
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=10
CONFIG_NET_IF_IPV6_PREFIX_COUNT=4
CONFIG_NET_IPV6_MAX_NEIGHBORS=12
CONFIG_NET_ROUTING=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IPV6_MLD=y

CONFIG_NET_BUF=y
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=24

CONFIG_KERNEL_MEM_POOL=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NEWLIB_LIBC=y

CONFIG_ASAN=y
CONFIG_NRF_RPC_THREAD_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=2560
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n
