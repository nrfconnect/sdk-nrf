CONFIG_SB_CRYPTO_NONE=y
CONFIG_SB_CRYPTO_PSA_ED25519=y
CONFIG_PSA_CRYPTO=y
CONFIG_NRFX_RRAMC=y
CONFIG_PSA_USE_CRACEN_AEAD_DRIVER=n
CONFIG_PSA_USE_CRACEN_MAC_DRIVER=n
CONFIG_PSA_USE_CRACEN_HASH_DRIVER=y
CONFIG_PSA_USE_CRACEN_CIPHER_DRIVER=y
CONFIG_PSA_USE_CRACEN_ASYMMETRIC_SIGNATURE_DRIVER=y

# NSIB blocks the KMU slots holding its signature keys before it boots this
# image, so signatures cannot be verified from the application. Requesting the
# BL_VALIDATE_FW EXT_API would abort a boot, because  NSIB does not export
# the API on this SoC series.
CONFIG_BL_VALIDATE_FW_EXT_API_UNUSED=y
