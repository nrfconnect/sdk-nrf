tests:
  bootloader.bl_validation:
    sysbuild: true
    # Ineffective here: unsatisfied dependency SECURE_BOOT_BOOTCONF_LOCK_WRITES, which defaults to
    # n on nRF54L05, nRF54L10 and nRF54L15 and is not enabled in this scenario, so
    # SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED stays n.
    # extra_args:
    #   - platform:nrf54l15dk/nrf54l15/cpuapp:SB_CONFIG_SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED=y
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf9151dk/nrf9151
      - nrf9160dk/nrf9160
      - nrf9161dk/nrf9161
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf9151dk/nrf9151
      - nrf9160dk/nrf9160
      - nrf9161dk/nrf9161
    tags:
      - b0
      - bl_validation
      - sysbuild
      - ci_tests_subsys_bootloader
