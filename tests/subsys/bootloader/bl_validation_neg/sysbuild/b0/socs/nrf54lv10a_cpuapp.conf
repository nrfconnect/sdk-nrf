CONFIG_CLOCK_CONTROL_NRF=n
# Ineffective here: selected by ONOFF, so NOTIFY stays y.
# CONFIG_NOTIFY=n
# Ineffective here: selected by CLOCK_CONTROL_NRF_ONOFF (default y), so ONOFF stays y.
# CONFIG_ONOFF=n

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_SB_CRYPTO_NONE=y
CONFIG_SB_CRYPTO_PSA_ED25519=y
CONFIG_PSA_CRYPTO=y

# Not used by default ED25519 signature on nRF54l
CONFIG_PSA_USE_CRACEN_AEAD_DRIVER=n
CONFIG_PSA_USE_CRACEN_MAC_DRIVER=n
# Hardware support for ED25519
CONFIG_PSA_USE_CRACEN_HASH_DRIVER=y
CONFIG_PSA_USE_CRACEN_CIPHER_DRIVER=y
CONFIG_PSA_USE_CRACEN_ASYMMETRIC_SIGNATURE_DRIVER=y

# Link Time Optimizations
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# FPROTECT depends on !(SOC_SERIES_NRF54L && IS_SECURE_BOOTLOADER), so it is not available here.
CONFIG_FPROTECT=n
