CONFIG_NRFX_NVMC=n
CONFIG_NRFX_RRAMC=y
CONFIG_SB_CRYPTO_OBERON_ECDSA_SECP256R1=y
CONFIG_SB_CRYPTO_OBERON_SHA256=y

