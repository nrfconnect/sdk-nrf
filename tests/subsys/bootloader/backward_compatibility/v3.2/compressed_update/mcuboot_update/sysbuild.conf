# Enable MCUboot bootloader support
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES=1
SB_CONFIG_MCUBOOT_COMPRESSED_IMAGE_SUPPORT=y
# NETCORE_HCI_IPC is a choice entry that only exists for SoCs with a separate
# network core, so it selected nothing on the single-core boards. It is applied
# from the extra_args of the nRF5340 scenario instead.
# SB_CONFIG_NETCORE_HCI_IPC=y
