CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16

# NSIB second-stage MCUboot validates secondary-slot images against primary-slot
# bounds. With NRF53_MULTI_IMAGE_UPDATE the default reset-vector check reads
# from the padded header gap (0xff); use ih_load_addr instead.
CONFIG_MCUBOOT_CHECK_HEADER_LOAD_ADDRESS=y

# The following configurations are required to support simultaneous multi-image update
CONFIG_FW_INFO=y
CONFIG_PCD_APP=y
# Ineffective here: unsatisfied dependency PCD_APP, which sysbuild disables when the network core
# image is not updated; moved to netcore_update.conf, which sysbuild.cmake adds for network core
# updates.
# CONFIG_PCD_READ_NETCORE_APP_VERSION=y

# The network core cannot access external flash directly. The flash simulator must be used to
# provide a memory region that is used to forward the new firmware to the network core
# Ineffective here: unsatisfied dependency DT_HAS_ZEPHYR_SIM_FLASH_ENABLED, because sysbuild adds
# the flash simulator node only for network core updates; moved to netcore_update.conf.
# CONFIG_FLASH_SIMULATOR=y
# Ineffective here: unsatisfied dependency FLASH_SIMULATOR when the network core image is not
# updated; moved to netcore_update.conf.
# CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_FLASH_SIMULATOR_STATS=n
