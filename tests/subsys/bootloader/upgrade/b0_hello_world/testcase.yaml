common:
  sysbuild: true
  slow: true
  build_only: false
  timeout: 300
  tags:
    - nsib
    - ci_tests_subsys_bootloader

tests:
  nsib.update.invalid_image:
    # Ineffective here: unsatisfied dependency SECURE_BOOT_BOOTCONF_LOCK_WRITES, which defaults to
    # n on nRF54L05, nRF54L10 and nRF54L15 and is not enabled in this scenario, so
    # SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED stays n.
    # extra_args:
    #   - platform:nrf54l15dk/nrf54l05/cpuapp:SB_CONFIG_SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED=y
    #   - platform:nrf54l15dk/nrf54l10/cpuapp:SB_CONFIG_SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED=y
    #   - platform:nrf54l15dk/nrf54l15/cpuapp:SB_CONFIG_SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED=y
    harness: pytest
    harness_config:
      pytest_root:
        - "../pytest/test_upgrade_invalid_application.py"
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf54l15dk/nrf54l05/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp

  nsib.security.tampered_app:
    # Ineffective here: unsatisfied dependency SECURE_BOOT_BOOTCONF_LOCK_WRITES, which defaults to
    # n on nRF54L05, nRF54L10 and nRF54L15 and is not enabled in this scenario, so
    # SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED stays n.
    # extra_args:
    #   - platform:nrf54l15dk/nrf54l15/cpuapp:SB_CONFIG_SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED=y
    harness: pytest
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf9151dk/nrf9151
      - nrf9160dk/nrf9160
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    harness_config:
      pytest_root:
        - "../pytest/test_security_tampered_app.py"

  nsib.image_validation.fw_info_discovery:
    tags:
      - nsib
      - fw_info_discovery
      - ci_tests_subsys_bootloader
    harness: pytest
    timeout: 600
    harness_config:
      pytest_root:
        - "../pytest/test_fw_info_discovery.py"
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    # Ineffective here: unsatisfied dependency SECURE_BOOT_BOOTCONF_LOCK_WRITES, which defaults to
    # n on nRF54L05, nRF54L10 and nRF54L15 and is not enabled in this scenario, so
    # SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED stays n.
    # extra_args:
    #   - platform:nrf54l15dk/nrf54l15/cpuapp:SB_CONFIG_SECURE_BOOT_BOOTCONF_ALLOW_UNDERSIZED=y
