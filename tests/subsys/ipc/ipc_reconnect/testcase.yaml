common:
  tags:
    - subsys
    - ipc
    - ci_tests_subsys_ipc
  sysbuild: true
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "Instance opened"
      - "Endpoint registered"
      - "Waiting for binding"
      - "IPC endpoint bound"
      - "Message 0 sent"
      - "Message 0 received"
      - "Message 1 sent"
      - "Message 1 received"
      - "Message 2 sent"
      - "Message 2 received"
      - "Disconnecting"
      - "IPC endpoint deregistered"
      - "IPC instance closed"
      - "Reconnecting"
      - "Instance opened"
      - "Endpoint registered"
      - "Waiting for binding"
      - "IPC endpoint bound"
      - "Message 2 sent"
      - "Message 2 received"

tests:
  subsys.ipc.ipc_reconnect.icmsg:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    extra_args:
      - ipc_reconnect_EXTRA_DTC_OVERLAY_FILE="boards/ipc0_icmsg.overlay"
      - remote_EXTRA_DTC_OVERLAY_FILE="boards/ipc0_icmsg.overlay"
      - platform:nrf54l:ipc_reconnect_SNIPPET=nordic-flpr
      - platform:nrf9251:ipc_reconnect_SNIPPET=nordic-ppr
