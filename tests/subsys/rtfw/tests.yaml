common:
  tags:
    - rtfw
    - unit
    - ci_tests_subsys_rtfw
  platform_allow:
    - native_sim
    - nrf54h20dk/nrf54h20/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
  integration_platforms:
    - native_sim
    - nrf54h20dk/nrf54h20/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp

tests:
  subsys.rtfw: {}

  subsys.rtfw.preinit:
    extra_configs:
      - CONFIG_TEST_RTFW_PREINIT=y

  subsys.rtfw.no_queue_stats:
    extra_configs:
      - CONFIG_RTFW_QUEUE_USAGE_STATS=n

  subsys.rtfw.no_event_handler:
    extra_configs:
      - CONFIG_TEST_RTFW_NO_EVENT_HANDLER=y
