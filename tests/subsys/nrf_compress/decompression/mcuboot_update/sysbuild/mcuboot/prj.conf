CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240
# MBEDTLS_CONFIG_FILE only exists when the mbedTLS module is part of the build.
# This MCUboot image signs with PSA/TinyCrypt backends, so the symbol was never
# defined and the file name went nowhere.
# CONFIG_MBEDTLS_CONFIG_FILE="mcuboot-mbedtls-cfg.h"

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

### mbedTLS has its own heap
# CONFIG_HEAP_MEM_POOL_SIZE is not set

CONFIG_FLASH=y
CONFIG_FPROTECT=y

### Various Zephyr boards enable features that we don't want.
# CONFIG_BT is not set
# CONFIG_I2C is not set

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
### Ensure Zephyr logging changes don't use more resources
CONFIG_LOG_DEFAULT_LEVEL=0
### Use info log level by default
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
### Decrease footprint by ~4 KB in comparison to CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_NANO=y
# NRF_RTC_TIMER_USER_CHAN_COUNT only exists on the SoCs that use the RTC as
# system timer; nRF54L and nRF54H use the GRTC instead. It is applied from the
# extra_args of the scenario that covers the RTC-based SoCs.
# CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0

# NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MCUboot"
# BOOT_MAX_IMG_SECTORS depends on !BOOT_MAX_IMG_SECTORS_AUTO, which is enabled by
# default, so the sector count is derived from the partition layout instead.
# CONFIG_BOOT_MAX_IMG_SECTORS=512
CONFIG_MULTITHREADING=y
