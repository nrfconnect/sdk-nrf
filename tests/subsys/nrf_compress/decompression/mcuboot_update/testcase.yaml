common:
  sysbuild: true
  tags:
    - sysbuild
    - ci_tests_subsys_nrf_compress
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "Starting bootloader"
      - "Image index: 0, Swap type: none"
      - "Bootloader chainload address offset:"
      - "Jumping to the first image slot"
      - "Starting bootloader"
      - "Image index: 0, Swap type: perm"
      - "Image 0 upgrade secondary slot -> primary slot"
      - "Erasing the primary slot"
      - "Image 0 copying the secondary slot to the primary slot"
      - "Bootloader chainload address offset:"
      - "Jumping to the first image slot"
      - "Booting nRF Connect SDK"
      - "Compressed image running"
tests:
  nrf_compress.decompression.mcuboot_update:
    extra_args:
      - mcuboot_CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
    integration_platforms:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
  # Split off from the scenario above: NRF_RTC_TIMER_USER_CHAN_COUNT is only
  # defined where the RTC is the system timer. nRF54L and nRF54H use the GRTC,
  # so the setting cannot be applied on these boards.
  nrf_compress.decompression.mcuboot_update.grtc:
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
