CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_CONSOLE=y
CONFIG_LOG=y

CONFIG_PSA_CRYPTO=y

CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_ML_KEM=y
CONFIG_PSA_WANT_ML_KEM_KEY_SIZE_768=y
CONFIG_PSA_WANT_KEY_TYPE_ML_KEM_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ML_KEM_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ML_KEM_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ML_KEM_KEY_PAIR_GENERATE=y

CONFIG_PSA_WANT_ALG_SHAKE128=y
CONFIG_PSA_WANT_ALG_SHAKE256=y
CONFIG_PSA_WANT_ALG_SHA3_256=y
CONFIG_PSA_WANT_ALG_SHA3_512=y

# The shared secret is delivered as an AES key
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y

# Used to derive an ML-KEM key pair
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_SHA_256=y
