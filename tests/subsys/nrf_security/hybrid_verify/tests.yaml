common:
  sysbuild: true
  platform_allow:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54l15dk/nrf54l10/cpuapp
    - nrf54l15dk/nrf54l05/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf54lv10dk/nrf54lv10a/cpuapp
  integration_platforms:
    - nrf54l15dk/nrf54l15/cpuapp
  tags:
    - sysbuild
    - crypto
    - ci_crypto
    - ci_tests_crypto

tests:
  hybrid_verify.cracen:
    timeout: 120

  hybrid_verify.cracen.psa_ml_dsa:
    timeout: 120
    extra_configs:
      - CONFIG_PSA_WANT_ALG_ML_DSA=y
      - CONFIG_PSA_WANT_KEY_TYPE_ML_DSA_PUBLIC_KEY=y
      - CONFIG_PSA_WANT_KEY_TYPE_ML_DSA_KEY_PAIR_EXPORT=y
      - CONFIG_PSA_WANT_ML_DSA_KEY_SIZE_44=y
      - CONFIG_PSA_WANT_ML_DSA_KEY_SIZE_65=y
      - CONFIG_PSA_WANT_ML_DSA_KEY_SIZE_87=y
      - CONFIG_PSA_WANT_ALG_SHAKE128=y
      - CONFIG_PSA_WANT_ALG_SHAKE256=y
