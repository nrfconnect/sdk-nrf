# Test framework, stack and heap sizes
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SPEED_OPTIMIZATIONS=y

# Console output and stack usage diagnostics
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# PSA Crypto with CRACEN as the only driver
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_DRIVER_OBERON=n
CONFIG_PSA_CRYPTO_DRIVER_CRACEN=y

# Mbed TLS heap
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

# Feature under test
CONFIG_CRACEN_HYBRID_VERIFY=y
CONFIG_CRACEN_HYBRID_VERIFY_ML_DSA_44=y
CONFIG_CRACEN_HYBRID_VERIFY_ML_DSA_65=y
CONFIG_CRACEN_HYBRID_VERIFY_ML_DSA_87=y

# ECDSA verification on P-256 and P-384, and the hashes it uses
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_SHA_512=y
