tests:
  dfu.dfu_extra:
    sysbuild: true
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "DFU Extra Images Test"
        - "=== Extra Image 1 ==="
        - "=== Extra Image 2 ==="
        - "Done"
    tags:
      - dfu
      - sysbuild
      - ci_tests_subsys_dfu
