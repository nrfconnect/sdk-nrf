# Standalone nRF71 short-range coexistence driver under test.
CONFIG_NRF71_SR_COEX_DRIVER=y

# The coexistence driver depends on both radios: the nRF71 Wi-Fi driver
# (FMAC coex transport) and Bluetooth (the Short-Range radio).
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_BT=y

# Entropy required by the Wi-Fi stack.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Networking (Wi-Fi driver build dependency).
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_HEAP_MEM_POOL_SIZE=230000

# IPC transport to the RPU.
CONFIG_IPC_SERVICE_BACKEND_ICMSG_WQ_ENABLE=y
CONFIG_IPC_SERVICE_BACKEND_ICMSG_WQ_STACK_SIZE=5600

# Logging.
CONFIG_LOG=y
CONFIG_NRF71_SR_COEX_DRIVER_LOG_LEVEL_DBG=y

CONFIG_MAIN_STACK_SIZE=5400
