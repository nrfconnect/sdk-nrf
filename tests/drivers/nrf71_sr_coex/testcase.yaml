common:
  depends_on: wifi
  tags:
    - ci_build
    - sysbuild
    - drivers
    - ci_tests_drivers_nrf_wifi
tests:
  drivers.nrf71_sr_coex.build:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7120dk/nrf7120/cpuapp
    platform_allow: nrf7120dk/nrf7120/cpuapp
  drivers.nrf71_sr_coex.build.shell:
    sysbuild: true
    build_only: true
    extra_configs:
      - CONFIG_SHELL=y
      - CONFIG_NRF71_SR_COEX_SHELL=y
      - CONFIG_NRF71_SR_COEX_WAIT_FOR_APP_INIT=y
      - CONFIG_BT_CENTRAL=y
      - CONFIG_NRF71_SR_COEX_BLE_CHAN_MAP=y
    integration_platforms:
      - nrf7120dk/nrf7120/cpuapp
    platform_allow: nrf7120dk/nrf7120/cpuapp
