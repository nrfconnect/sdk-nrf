description: |
    This binding provides resources required to build and run the
    tests/drivers/gpio/hpf_gpio_basic_api test in Zephyr.

compatible: "test-hpf-gpio"

properties:
  out-gpios:
    type: phandle-array
    required: true
    description: |
      Identity of HPF GPIOs that will be configured as outputs.
      These must be on GPIO instances to which FLPR has access.
      Each entry must be physically connected to the in-gpios entry
      at the same index.

  in-gpios:
    type: phandle-array
    required: true
    description: |
      Identity of hardware GPIOs that will be configured as inputs.
      Each entry must be physically connected to the out-gpios entry
      at the same index.
