common:
  tags:
    - fprotect
    - ignore_faults
    - ci_tests_drivers_fprotect
  platform_allow:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54l15dk/nrf54l10/cpuapp
    - nrf54l15dk/nrf54l05/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf54lv10dk/nrf54lv10a/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuapp
    - nrf54ls05dk/nrf54ls05a/cpuapp
    - nrf54ls05dk/nrf54ls05b/cpuapp
    - nrf7120dk/nrf7120/cpuapp
  integration_platforms:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54l15dk/nrf54l10/cpuapp
    - nrf54l15dk/nrf54l05/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf54lv10dk/nrf54lv10a/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuapp
    - nrf54ls05dk/nrf54ls05a/cpuapp
    - nrf54ls05dk/nrf54ls05b/cpuapp
    - nrf7120dk/nrf7120/cpuapp

tests:
  drivers.fprotect.negative_rram_mram.basic:
    extra_configs:
      - CONFIG_TEST_FPROTECT_NEGATIVE_RRAM_MRAM_BASIC=y
  drivers.fprotect.negative_rram_mram.boundary:
    extra_configs:
      - CONFIG_TEST_FPROTECT_NEGATIVE_RRAM_MRAM_BOUNDARY=y
  drivers.fprotect.negative_rram_mram.flash_write:
    extra_configs:
      - CONFIG_TEST_FPROTECT_NEGATIVE_RRAM_MRAM_FLASH_WRITE=y
