# This suite is a whitebox unit test for the TAC5112 codec driver and uses
# neither entropy nor cryptography. On nRF54L the PSA crypto provider defaults
# on (from the zephyr,psa-crypto-rng devicetree node) and pulls in the whole
# nrf_security/CRACEN stack. Building it for this build-only compile check is
# pure overhead and, because its object paths are very deeply nested, also
# overflows CMAKE_OBJECT_PATH_MAX on Windows hosts. Disabling PSA crypto (the
# master switch for nrf_security) plus Mbed TLS and the entropy generator keeps
# the image lean and lets the compile check build everywhere.
CONFIG_PSA_CRYPTO=n
CONFIG_MBEDTLS=n
CONFIG_ENTROPY_GENERATOR=n
