common:
  tags:
    - drivers
    - ci_tests_drivers_watchdog
  harness: console
  timeout: 20

tests:
  drivers.watchdog.soft_reset_reconf:
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "WDT reconfigure after software reset executed on"
        - "RESET_PIN detected"
        - "Trigger Software reset"
        - "RESET_SOFTWARE detected"
        - "Wait to see if WDT is disabled"
        - "Watchdog configured with window of"
        - "Test completed"
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpunet
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54h20dk/nrf54h20/cpurad
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54ls05dk/nrf54ls05a/cpuapp
      - nrf54ls05dk/nrf54ls05b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp

  drivers.watchdog.cpu_lockup_reset_reconf:
    extra_configs:
      - CONFIG_TEST_CPU_LOCKUP_RESET=y
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "WDT reconfigure after cpu lockup reset executed on"
        - "RESET_PIN detected"
        - "Trigger CPU Lockup reset"
        - "RESET_CPU_LOCKUP detected"
        - "Wait to see if WDT is disabled"
        - "Watchdog configured with window of"
        - "Test completed"
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpunet
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54h20dk/nrf54h20/cpurad
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54ls05dk/nrf54ls05a/cpuapp
      - nrf54ls05dk/nrf54ls05b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp

  drivers.watchdog.soft_reset_reconf.not_stopped:
    extra_configs:
      - CONFIG_NRFX_WDT_CONFIG_STOP_AT_INIT=n
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "WDT reconfigure after software reset executed on"
        - "RESET_PIN detected"
        - "Trigger Software reset"
        - "RESET_SOFTWARE detected"
        - "Feeding WDT returns -22, expected -EINVAL (-22)"
        - "Watchdog configured with window of"
        - "Test completed"
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpunet
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54h20dk/nrf54h20/cpurad
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54ls05dk/nrf54ls05a/cpuapp
      - nrf54ls05dk/nrf54ls05b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp

  drivers.watchdog.cpu_lockup_reset_reconf.not_stopped:
    extra_configs:
      - CONFIG_TEST_CPU_LOCKUP_RESET=y
      - CONFIG_NRFX_WDT_CONFIG_STOP_AT_INIT=n
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "WDT reconfigure after cpu lockup reset executed on"
        - "RESET_PIN detected"
        - "Trigger CPU Lockup reset"
        - "RESET_CPU_LOCKUP detected"
        - "Wait to see if WDT is disabled"
        - "Watchdog configured with window of"
        - "Test completed"
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpunet
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54h20dk/nrf54h20/cpurad
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54ls05dk/nrf54ls05a/cpuapp
      - nrf54ls05dk/nrf54ls05b/cpuapp
      - nrf54lv10dk/nrf54lv10a/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
