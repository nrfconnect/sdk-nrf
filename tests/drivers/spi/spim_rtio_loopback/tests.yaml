common:
  depends_on: spi
  tags:
    - drivers
    - spim
    - rtio
    - ci_tests_drivers_spi
  harness: ztest
  harness_config:
    fixture: gpio_loopback
  platform_allow:
    - nrf5340dk/nrf5340/cpuapp
    - nrf54h20dk/nrf54h20/cpuapp
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf7120dk/nrf7120/cpuapp
  integration_platforms:
    - nrf54l15dk/nrf54l15/cpuapp

tests:
  drivers.spi.spim_rtio_loopback.mode0:
    extra_configs:
      - CONFIG_TEST_SPI_MODE=0
  drivers.spi.spim_rtio_loopback.mode1:
    extra_configs:
      - CONFIG_TEST_SPI_MODE=1
  drivers.spi.spim_rtio_loopback.mode2:
    extra_configs:
      - CONFIG_TEST_SPI_MODE=2
  drivers.spi.spim_rtio_loopback.mode3:
    extra_configs:
      - CONFIG_TEST_SPI_MODE=3
