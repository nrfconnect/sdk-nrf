common:
  tags:
    - drivers
    - ci_tests_drivers_pulse_meas
  harness: ztest
  harness_config:
    fixture: gpio_loopback
  timeout: 20
  platform_allow:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54h20dk/nrf54h20/cpuapp
  integration_platforms:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54h20dk/nrf54h20/cpuapp

tests:
  drivers.pulse_meas: {}
  drivers.pulse_meas.use_hfclk:
    extra_configs:
      - CONFIG_PULSE_MEAS_USE_HFCLK=y
  drivers.pulse_meas.pm:
    extra_configs:
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
