common:
  tags:
    - drivers
    - ci_tests_drivers_pulse_meas
  harness: ztest
  harness_config:
    fixture: gpio_loopback
  timeout: 20
  platform_allow:
    - nrf54h20dk/nrf54h20/cpuapp
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf54ls05dk/nrf54ls05a/cpuapp
    - nrf54ls05dk/nrf54ls05b/cpuapp
    - nrf7120dk/nrf7120/cpuapp
    - nrf7120dk/nrf7120e/cpuapp
    - nrf9251dk/nrf9251/cpuapp
  integration_platforms:
    - nrf54h20dk/nrf54h20/cpuapp
    - nrf54l15dk/nrf54l15/cpuapp

tests:
  drivers.pulse_meas: {}
  drivers.pulse_meas.use_hfclk:
    extra_configs:
      - CONFIG_PULSE_MEAS_USE_HFCLK=y
  drivers.pulse_meas.pm:
    extra_configs:
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
  drivers.pulse_meas.use_hfclk.pm:
    extra_configs:
      - CONFIG_PULSE_MEAS_USE_HFCLK=y
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
