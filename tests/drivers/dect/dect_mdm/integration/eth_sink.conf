# Ethernet sink FT variant (replaces cellular PPP mock uplink).
# Use with Twister: extra_args: EXTRA_CONF_FILE=eth_sink.conf

CONFIG_MODEM_CELLULAR=n

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_ETH_DRIVER=n

CONFIG_NET_ROUTING=y
CONFIG_NET_L2_DECT_MTU=1500

# Subset aligned with nrf/samples/dect/dect_shell/eth_common.conf.
# All ND-proxy / upstream-route sub-Kconfigs are enabled so the eth-only
# tests in test_dect_eth_integration.c actually exercise those paths.
CONFIG_NET_L2_DECT_BR_IPV6_ETH_UPSTREAM_PREFIX_ROUTE=y
CONFIG_NET_L2_DECT_BR_IPV6_ETH_ND_PROXY_PT=y
CONFIG_NET_L2_DECT_BR_IPV6_ETH_ND_PROXY_PT_NS=y
CONFIG_NET_L2_DECT_BR_IPV6_ETH_ND_PROXY_PT_NS_UNICAST_INTERCEPT=y
CONFIG_NET_L2_DECT_BR_IPV6_ETH_ND_PROXY_PT_NS_PRIME=y
CONFIG_NET_L2_DECT_BR_IPV6_ETH_ND_PROXY_PT_NA_UNICAST_REFRESH=y
# Required for test_dect_ft_eth_unsol_na and the NA_UNICAST_REFRESH path.
CONFIG_NET_L2_DECT_BR_UNSOLICITED_NA=y
# 0 ms pacing: tests are deterministic and time-bounded; the runtime pacing
# is not exercised here (see sample overlays for realistic values).
CONFIG_NET_L2_DECT_BR_IPV6_ETH_TX_PACING_MS=0

# ND proxy MLD join for solicited-node group and NPF-based unicast NS
# intercept both required by the eth-only tests.
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_PKT_FILTER=y
CONFIG_NET_PKT_FILTER_IPV6_HOOK=y

CONFIG_NET_IF_IPV6_PREFIX_COUNT=3
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=12
