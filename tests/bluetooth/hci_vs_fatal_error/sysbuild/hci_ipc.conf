# Report the fatal errors as Vendor Specific HCI events and reset afterwards.
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_BT_HCI_VS_FATAL_ERROR=y
CONFIG_RESET_ON_FATAL_ERROR=y

# Announce with a Command Complete for the NOP opcode that the network core has booted, so that
# the test knows when it may start sending HCI commands again after a reset.
CONFIG_BT_WAIT_NOP=y

# Test-only fault injection hook, must never be enabled in a production image. The hook needs
# irq_offload() to raise the fatal error from an interrupt context, which in turn requires the
# image to be marked as a test.
CONFIG_TEST=y
CONFIG_IRQ_OFFLOAD=y
CONFIG_ZERO_LATENCY_IRQS=y
CONFIG_HCI_IPC_FATAL_ERROR_TEST_HOOK=y
CONFIG_HCI_IPC_FATAL_ERROR_TEST_HOOK_ZLI=y
