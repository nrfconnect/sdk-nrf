board:
  name: nrf54lv10dk
  full_name: nRF54LV10 DK
  vendor: nordic
  socs:
    - name: nrf54lv10a
      variants:
        - name: ns
          cpucluster: cpuapp
  revision:
    format: major.minor.patch
    default: "0.7.0"
    revisions:
      - name: "0.7.0"
runners:
  run_once:
    '--recover':
      - runners:
          - nrfutil
        run: first
        groups:
          - boards:
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuapp
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuapp/ns
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuflpr
    '--erase':
      - runners:
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuapp
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuapp/ns
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuflpr
    '--reset':
      - runners:
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuapp
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuapp/ns
              - nrf54lv10dk@0.7.0/nrf54lv10a/cpuflpr
