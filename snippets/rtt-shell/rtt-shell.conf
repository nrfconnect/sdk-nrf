# Run the interactive shell over SEGGER RTT (instead of UART) so a full shell
# session is available over the on-board J-Link, without a debugger. Connect
# with JLinkRTTClient. Use it with:
#
#   west build -b <board> -S rtt-shell
#

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# SEGGER RTT transport.
CONFIG_USE_SEGGER_RTT=y

# Shell on RTT, off UART. SHELL_BACKEND_RTT selects CONSOLE and RTT_CONSOLE, so
# printk()/console ride the same RTT up-buffer as the shell.
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_UART_CONSOLE=n

# Logs go to a dedicated RTT backend, NOT through the shell. The shell log
# backend only drains once the shell thread is running, so boot/init logs (and
# anything printed while init is blocked) would never appear. A standalone RTT
# backend is drained by the log thread during any sleep, so logs show up right
# away. Cost: log lines can interleave with the prompt on the shared up-buffer.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Headroom so log/print bursts are not dropped.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
