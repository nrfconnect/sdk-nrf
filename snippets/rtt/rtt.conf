# Route console, printk and logging over SEGGER RTT so they can be read with an
# RTT client (e.g. JLinkRTTClient/JLinkRTTLogger) over the on-board J-Link,
# without attaching a debugger. Use it with:
#
#   west build -b <board> -S rtt
#

# Some samples disable logging/console for an SWD-only run; pull them back in.
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# SEGGER RTT transport.
CONFIG_USE_SEGGER_RTT=y

# printk()/console output over RTT instead of UART.
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# LOG_* macros go straight to RTT via the dedicated RTT log backend. Keep the
# shell out of the log path so the two do not fight over the up-buffer; the
# interactive shell (if any) stays on its own backend.
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=n

# Headroom so log bursts are not dropped.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
