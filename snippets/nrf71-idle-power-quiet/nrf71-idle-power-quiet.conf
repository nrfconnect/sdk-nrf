# Silence the console for a clean idle-current measurement. Coredump-over-
# logging pulls in the logging core if left enabled, so drop it here too.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_DEBUG_COREDUMP=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
