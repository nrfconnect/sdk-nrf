# nRF71 idle power helpers: pull in the device PM Kconfig options needed
# for peripherals to suspend while idle. Keep the default
# RAM_RETAIN_FULL tier -- RAM_RETAIN_UNUSED_ONLY has been observed to
# cause issues on Wi-Fi builds. See the lib_nrf71_idle_power library
# documentation for details.
CONFIG_NRF71_IDLE_POWER=y
