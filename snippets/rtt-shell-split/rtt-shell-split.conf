#
# Split the shell and the log stream onto separate SEGGER RTT up-buffers so the
# prompt stays clean while logs flow in parallel:
#
#   - up/down-buffer 0: interactive shell (+ printk banner) -> JLinkRTTClient
#   - up-buffer 1:      LOG_* output                        -> JLinkRTTLogger -RTTChannel 1
#
# Use it with:
#
#   west build -b <board> -S rtt-shell-split
#

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# SEGGER RTT transport.
CONFIG_USE_SEGGER_RTT=y

# Shell on RTT buffer 0 (the terminal buffer JLinkRTTClient attaches to), off
# UART. SHELL_BACKEND_RTT selects CONSOLE and RTT_CONSOLE, so the printk banner
# also lands on buffer 0 next to the prompt.
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_UART_CONSOLE=n

# Logs on their own RTT up-buffer (index 1) via a dedicated backend, not through
# the shell. This keeps buffer 0 free of log spew and, being a standalone
# backend, it drains during init sleeps so boot/init logs are not lost.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER=1
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=4096
