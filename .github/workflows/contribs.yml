name: Contribs
on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  contribs:
    runs-on: ubuntu-24.04
    name: Contribs
    steps:
      - name: Contribs
        uses: carlescufi/action-contribs@d139e12dabbe631fcc94ec3e19e386a11d3e1a26 # main
        with:
          github-token: ${{ secrets.NCS_GITHUB_TOKEN }}
          command: 'external'
          messages: |
                    Thank you for your contribution!
                    It seems you are not a member of the nrfconnect GitHub organization. Under our current policy, pull requests from external contributors are handled as follows:
                    - Review: Your pull request is visible to the nRF Connect SDK team, and maintainers may read, comment on, and review it.
                    - Testing: We do not run internal CI or hardware testing on pull requests from external contributors.
                    - Merging: We cannot merge pull requests from external contributors.
                    Review feedback is provided on a best-effort basis and does not mean the pull request will be merged.
                    If you are reporting a bug, need a feature, or have questions about the nRF Connect SDK, contact our Technical Support team on DevZone: https://devzone.nordicsemi.com/.
                    |
                    The author of this pull request has now been added to the nrfconnect GitHub organization.
          labels: 'external'
