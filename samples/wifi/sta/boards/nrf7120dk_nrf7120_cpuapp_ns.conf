# Lower System ON idle current: see lib_nrf71_idle_power. Keep the
# default RAM_RETAIN_FULL tier; RAM_RETAIN_UNUSED_ONLY has been observed
# to cause issues on Wi-Fi builds.
CONFIG_NRF71_IDLE_POWER=y

# This sample is primarily used for power measurements on this board;
# silence the console for a clean idle-current reading, matching the
# nrf71-idle-power-quiet snippet. NET_LOG selects LOG, so it has to be
# turned off explicitly too, or prj.conf's CONFIG_NET_LOG=y would keep
# forcing LOG back on.
CONFIG_NET_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_DEBUG_COREDUMP=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
