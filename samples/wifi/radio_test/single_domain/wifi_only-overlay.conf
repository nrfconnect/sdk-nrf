# Wi-Fi only radio test overlay
# Disables peripheral BLE radio test and enables WiFi radio test mode
# Works on both nRF70 and nRF71

# Enable WiFi-only mode (disables peripheral BLE radio test)
CONFIG_SAMPLE_WIFI_RADIO_TEST_WIFI_ONLY=y

# Disable peripheral BLE radio test specific features
CONFIG_CONSOLE_HANDLER=n
CONFIG_FEM_AL_LIB=n
CONFIG_ENTROPY_GENERATOR=n
CONFIG_PSA_CRYPTO=n
CONFIG_NRFX_TIMER=n
CONFIG_DYNAMIC_INTERRUPTS=n
