CONFIG_WIFI=y

#CONFIG_INIT_STACKS=y

# Memories
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
#64K memory needed for IQ sample captures.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=32768
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y


# Debugging
CONFIG_STACK_SENTINEL=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_SHELL_CMDS_RESIZE=n
#CONFIG_DEBUG=y

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
# With CONFIG_LOG_PRINTK=y, printk() (and the NCS boot banner, which uses
# it at SYS_INIT APPLICATION level, before main()) is routed through the
# shell's log backend. That backend starts out disabled and is only
# enabled once the shell thread itself runs shell_start() - normally left
# to happen whenever the shell thread first gets scheduled, which isn't
# guaranteed to happen before APPLICATION level on this sample's thin
# boot. Take explicit control of that instead of leaving it to the
# scheduler: disable shell autostart here and call shell_start()
# ourselves from a SYS_INIT right after the shell UART backend's own
# init, so the log backend is deterministically enabled before
# APPLICATION level runs. See src/early_shell_start.c.
CONFIG_SHELL_AUTOSTART=n
CONFIG_SHELL_GETOPT=y
CONFIG_DEVICE_SHELL=y
CONFIG_POSIX_TIMERS=y
CONFIG_DATE_SHELL=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024

# Peripheral radio test configuration
CONFIG_CONSOLE_HANDLER=y
CONFIG_SHELL=y

CONFIG_DYNAMIC_INTERRUPTS=y

CONFIG_NRFX_TIMER=y
CONFIG_CLOCK_CONTROL=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_CRYPTO=y

CONFIG_FEM_AL_LIB=y
CONFIG_PICOLIBC_IO_FLOAT=y
