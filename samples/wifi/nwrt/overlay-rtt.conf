#
# Route console and logging over SEGGER RTT so logs can be read with an RTT
# client (e.g. JLinkRTTClient/JLinkRTTLogger) over the on-board J-Link,
# without attaching a debugger. Layer this on top of prj.conf:
#
#   west build -b nrf7120dk/nrf7120/cpuapp -- -DEXTRA_CONF_FILE=overlay-rtt.conf
#

# Re-enable logging and printk (prj.conf turns them off for the SWD-only test).
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# SEGGER RTT transport.
CONFIG_USE_SEGGER_RTT=y

# printk()/console output over RTT instead of UART.
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# LOG_* macros go straight to RTT via the dedicated RTT log backend, not
# through the shell. Stop the shell from claiming the log output so the two do
# not fight over it; the interactive shell stays on its default UART backend.
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=n

# Give RTT enough headroom so bursts of Wi-Fi/radio-test logs are not dropped.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
