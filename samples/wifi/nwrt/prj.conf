# nRF71 Wi-Fi driver in radio-test mode
CONFIG_WIFI=y
CONFIG_WIFI_NRF71=y
CONFIG_NRF71_RADIO_TEST=y

# Memories
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=78304

# Debugging
CONFIG_STACK_SENTINEL=y

# No console logging (production test uses SWD shadow only)
CONFIG_LOG=n
CONFIG_PRINTK=n

# GRTC/system-timer clock source.
#
# The SYSCOUNTER needs its low-frequency clock running before the timer driver
# latches the tick base at SYS_INIT EARLY. LFXO is only requested later (in
# grtc_post_init) and the crystal needs time to stabilise, so at EARLY init the
# counter has no clock, reads back garbage, and the first compare is armed at a
# bogus value that never fires - the kernel tick never advances. The internal
# low-power RC starts almost immediately, so the counter is valid from EARLY on.
CONFIG_NRF_GRTC_TIMER_SOURCE_LFLPRC=y
