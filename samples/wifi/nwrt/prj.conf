# nRF71 Wi-Fi driver in radio-test mode
CONFIG_WIFI=y
CONFIG_WIFI_NRF71=y
CONFIG_NRF71_RADIO_TEST=y

# Memories
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=78304

# Debugging
CONFIG_STACK_SENTINEL=y

# No console logging (production test uses SWD shadow only)
CONFIG_LOG=n
CONFIG_PRINTK=n
