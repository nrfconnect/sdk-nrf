# General
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_INIT_STACKS=y

# Logging and shell
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_DEVICE_SHELL=y

# Wi-Fi
CONFIG_WIFI=y
CONFIG_NRF_WIFI_IF_AUTO_START=y

# Operating band passed to the Wi-Fi firmware. Wi-Fi shares the 2.4 GHz band with
# Bluetooth LE, so use dual band, or CONFIG_NRF_WIFI_2G_BAND=y to test only 2.4 GHz.
CONFIG_NRF_WIFI_DUAL_BAND=y

# On the nRF7120 DK, the nRF71 IPC holds commands and events (including every scan
# result) in this heap until the Wi-Fi core processes them. Going below the driver
# default of 40000 stalls "wifi scan" in a crowded environment.
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=40000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=168192

# Variable-size net bufs save RAM, but can split an IPv4/UDP header across fragments.
# Fixed-size buffers (see CONFIG_NET_BUF_FIXED_DATA_SIZE below) keep headers contiguous.
CONFIG_NRF_WIFI_USE_VARIABLE_NET_BUFS=n

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y

# Wi-Fi credentials. Connect with the "wifi connect" command.
CONFIG_WIFI_CREDENTIALS=y

# Settings storage
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=4
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=5
CONFIG_ZVFS_POLL_MAX=12
CONFIG_ZVFS_OPEN_MAX=16

# zperf server for the download direction
CONFIG_NET_ZPERF_SERVER=y

# Net management. Printing of scan results puts pressure on the queues in the new
# locking design in net_mgmt, so use a higher timeout for a crowded environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Zephyr NET Connection Manager Connectivity layer
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=5000
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=n
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_DOWN=n

# Network statistics and shell commands
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# Wi-Fi is the default interface. main() calls net_config_init_app() on it, which
# assigns the static address and starts DHCP. The timeout of 0 keeps main() from
# blocking while it waits.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.99"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# main() already calls net_config_init_app() on the Wi-Fi interface, so skip the
# automatic call at boot.
CONFIG_NET_CONFIG_AUTO_INIT=n

# Network buffers, tuned for throughput
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=1600

# Wi-Fi throughput (zperf)
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1024

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=41808
CONFIG_MBEDTLS_HEAP_SIZE=1024
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_LONG_WQ_STACK_SIZE=2560

# Bluetooth LE
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Nordic_Throughput"
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2

CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1

CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_THROUGHPUT=y

# The sample drives the data length and PHY updates itself. Leaving the host's
# automatic PHY update enabled makes both run at connection, and the second one gets
# 0x3a (busy).
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_CENTRAL_NONE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# Bluetooth LE buffers
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=498

# The Bluetooth LE controller data length and PHY defaults are set in Kconfig so
# they only apply to the image that contains the controller.

# Frame Space Update renegotiates T_IFS.
CONFIG_BT_FRAME_SPACE_UPDATE=n
CONFIG_BT_LE_EXTENDED_FEAT_SET=n

# Debugging
CONFIG_STACK_SENTINEL=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# Set to y (with CONFIG_THREAD_ANALYZER_AUTO=y) to print thread stack usage.
# Use CONFIG_THREAD_ANALYZER_AUTO_INTERVAL (in seconds) to control the interval
# between the two successive prints.
CONFIG_THREAD_ANALYZER=n

# Wi-Fi and Short-Range coexistence. The driver programs the on-chip Coexistence
# Controller (COEXC) and configures the Coexistence Manager each time the Wi-Fi
# interface comes up. The coexistence bring-up in main() and the coex_enable_wifi_sr
# and coex_disable_wifi_sr commands need it.
CONFIG_NRF71_SR_COEX_DRIVER=y

# MPSL radio coexistence interface. The Bluetooth LE controller then requests the
# radio through the coexistence arbiter before each radio activity, so Wi-Fi and
# Bluetooth LE do not use the shared 2.4 GHz band at the same time.
CONFIG_MPSL_CX=y
