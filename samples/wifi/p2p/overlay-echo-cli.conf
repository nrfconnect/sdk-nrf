# P2P client: join a GO and run the echo client.
# Build: -DEXTRA_CONF_FILE=overlay-echo-cli.conf
CONFIG_SAMPLE_P2P_CLI_MODE=y
CONFIG_SAMPLE_P2P_CONNECTION_METHOD_PBC=y
CONFIG_SAMPLE_P2P_JOIN=y
CONFIG_SAMPLE_P2P_ECHO_CLI_MODE=y

# Use the GO's DHCP, not prj.conf's static address (avoids a clash).
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""

# Set to the GO's MAC: CONFIG_SAMPLE_P2P_PEER_ADDRESS="aa:bb:cc:dd:ee:ff"
