CONFIG_NRF71_AP_SUPPORT=n
CONFIG_NRF71_P2P_SUPPORT=n
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NRF71_RX_NUM_BUFS=8
CONFIG_NRF71_CTRL_HEAP_SIZE=25000
CONFIG_NRF71_DATA_HEAP_SIZE=30000
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_PICOLIBC_USE_MODULE=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_NRF70_QSPI_LOW_POWER=n
CONFIG_NRF71_UTIL_SHELL=n
CONFIG_NRF71_MAX_TX_AGGREGATION=1
CONFIG_NRF71_MAX_TX_TOKENS=5
CONFIG_ZVFS_POLL_MAX=20
# Sockets: select + poll take up more stack
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4600

CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=15000
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=6400
# Pinned so TCP RX does not shrink with the smaller RX pool
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4266
CONFIG_NET_CONTEXT_SNDBUF=y
CONFIG_NET_CONTEXT_RCVBUF=y

CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1600
CONFIG_NET_ZPERF_TCP_RECEIVER_BUF_SIZE=2048
# Only for async zperf
CONFIG_ZPERF_WORK_Q_THREAD_PRIORITY=5

# Avoid per-context-switch scheduler overhead
CONFIG_THREAD_MONITOR=n
CONFIG_TIMESLICING=n
