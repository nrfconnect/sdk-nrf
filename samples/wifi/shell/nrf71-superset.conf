# nRF7120 shell superset: all Wi-Fi modes, zperf, enterprise, and optional
# networking features enabled for QA / memory stress testing.

CONFIG_WIFI_NRF71=y

# All Wi-Fi operating modes (single VIF; runtime mode selection via shell)
CONFIG_NRF71_STA_MODE=y
CONFIG_NRF71_AP_MODE=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y
CONFIG_NRF71_P2P_MODE=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_P2P=y
CONFIG_NRF71_RAW_DATA_RX=y
CONFIG_NRF71_PROMISC_DATA_RX=y
CONFIG_NRF71_RAW_DATA_TX=y
CONFIG_NRF71_SYSTEM_WITH_RAW_MODES=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_NET_DHCPV4_SERVER=y

# Zperf
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_ZVFS_POLL_MAX=20
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# Enterprise
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_ENTERPRISE=y
CONFIG_NET_BUF_VARIABLE_DATA_SIZE=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=70000
CONFIG_TLS_CREDENTIALS_SHELL=y
CONFIG_BASE64=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_CREDENTIALS_SHELL_CRED_BUF_SIZE=8192
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=6
CONFIG_HEAP_MEM_POOL_ADD_SIZE_TLS_CRED_SHELL=9000
CONFIG_WIFI_CREDENTIALS_RUNTIME_CERTIFICATES=y
CONFIG_WIFI_SHELL_RUNTIME_CERTIFICATES=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=12000

# Superset extras
CONFIG_WPA_CLI=y
CONFIG_NET_IPV4_FRAGMENT=y
CONFIG_NET_IPV4_FRAGMENT_MAX_PKT=24
CONFIG_WIFI_NM_WPA_SUPPLICANT_WEP=y
CONFIG_NET_ARP_GRATUITOUS_TRANSMISSION=y
CONFIG_NET_ARP_GRATUITOUS_INTERVAL=30

# Driver / shell utilities
CONFIG_NRF71_UTIL=y

# Performance tuning
CONFIG_PICOLIBC_USE_MODULE=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4600
CONFIG_NET_PKT_RX_COUNT=28
CONFIG_NET_PKT_TX_COUNT=27
CONFIG_NET_BUF_RX_COUNT=28
CONFIG_NET_BUF_TX_COUNT=54
CONFIG_NRF_WIFI_LOW_POWER=n
CONFIG_NRF71_RX_NUM_BUFS=48
CONFIG_NRF71_MAX_TX_AGGREGATION=12
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=25000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=199856
CONFIG_HEAP_MEM_POOL_SIZE=100000
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_LOG_RATELIMIT=n
CONFIG_POSIX_MULTI_PROCESS=n
