# nRF71 zperf overlay: build shell with EXTRA_CONF_FILE=nrf71-zperf.conf
# TCP STA upload: zperf tcp upload -n -a <host> 5001 10 1400
# TCP STA download: zperf tcp download 5001 (peer sends, e.g. iperf -c)
# UDP flood: zperf udp upload <host> 5001 10 1K <high rate e.g. 800M>
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
# Zperf TCP=6, UDP=2, Others=1
CONFIG_ZVFS_POLL_MAX=20
# Sockets: select + poll take up more stack
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4600

# Optimized networking settings for performance
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=80
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=90000
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768
CONFIG_NET_CONTEXT_SNDBUF=y
# Only for async zperf
CONFIG_ZPERF_WORK_Q_THREAD_PRIORITY=5
CONFIG_NRF71_MAX_TX_TOKENS=12
CONFIG_HEAP_MEM_POOL_SIZE=40144
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=250000
CONFIG_NRF70_QSPI_LOW_POWER=n
# To enable optimization configuration options
CONFIG_PICOLIBC_USE_MODULE=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_CACHE_MANAGEMENT=y

# Necessary for zperf_tcp_receiver.c
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# Zephyr NET Connection Manager Connectivity layer.
CONFIG_NET_CONNECTION_MANAGER=n

# Consumes more memory
CONFIG_WIFI_CREDENTIALS=n
CONFIG_FLASH=n
CONFIG_NVS=n
CONFIG_SETTINGS=n
CONFIG_NRF71_UTIL=y
CONFIG_NRF71_DEBUG_SHELL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Disable rate limiting to avoid log flooding (default is drop)
CONFIG_LOG_RATELIMIT=n

# Disabled to avoid pulling in CONFIG_THREAD_RUNTIME_STATS, whose
# per-context-switch overhead reduces throughput.
CONFIG_POSIX_MULTI_PROCESS=n
CONFIG_THREAD_MONITOR=n
CONFIG_TIMESLICING=n
CONFIG_NRF71_MAX_TX_AGGREGATION=7
CONFIG_NRF71_MAX_TX_PENDING_QLEN=36
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1600

# Receive path (TCP download / zperf tcp download)
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=60000
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768
CONFIG_NET_CONTEXT_RCVBUF=y
CONFIG_NET_ZPERF_TCP_RECEIVER_BUF_SIZE=2048
CONFIG_NRF71_RX_NUM_BUFS=24
