# nrf7120dk idle power optimization configuration
# Optimizes the nrf7120dk board for low idle power with Wi-Fi active

# Include base idle power settings
-include ../configs/idle_power_base.conf

# RAM power management - keep only essential memory powered
-include ../configs/ram_power_down.conf

# Wi-Fi specific optimizations
-include ../configs/wifi_idle_optimization.conf

# Device PM configuration
-include ../configs/device_idle.conf

# nrf7120 specific low power settings
CONFIG_NRF7120_SYSTEM_ON=y

# Use low power mode for improved idle current
CONFIG_NRF7120_LP_MODE_CONFIG=y
