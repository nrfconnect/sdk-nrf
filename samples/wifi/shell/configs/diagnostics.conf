# Diagnostic configuration for power measurement
# Print persistent power, regulator, memory state before idle
# Use with logic analyzer on GPIO pins to correlate with power traces

CONFIG_NRF7120_IDLE_DIAGNOSTICS=y

# Power domain signal routing to GPIO P0.10 for measurement
# Select which signal to observe (1=PD_MAIN, 3=PD_PERIPH, 4=PD_MCU,
# 5=PD_RADIO, 6=PD_CRACEN, 7=PD_WIFI, 8=PwrAboveElv, 11=InLpMode)
CONFIG_NRF7120_PDSELECT_SIGNAL=7
