# Quiet mode for clean idle power measurements
# Disables UART, console, printk, and boot banners
# Use this variant for power consumption measurements when debug output not needed

# Disable all console/debug output that consumes power
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_PM_DEVICE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# Keep basic shell functionality but silent
CONFIG_SHELL=y
CONFIG_WIFI=y
CONFIG_NET_SHELL=n
