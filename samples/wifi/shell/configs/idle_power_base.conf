# Base power management configuration for idle optimization
# Enables core PM features while keeping Wi-Fi operational

# Core PM support
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Tickless idle kernel support - reduces unnecessary clock ticks
CONFIG_TICKLESS_KERNEL=y

# System idle handling - allows idle to stop the system timer without uptime preservation
CONFIG_SYSTEM_CLOCK_SLOPPY_IDLE=y
