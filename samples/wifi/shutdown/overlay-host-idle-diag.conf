# Host idle diagnostics build.
#
# Same idle path as overlay-host-idle.conf, but keeps logging enabled and
# prints a power-state snapshot (POWER/MEMCONF/GRTC/LFXO) right before the
# host idles. Read CONSTLATSTAT to see whether constant-latency mode is
# holding HFCLK on, and MEMCONF to confirm which RAM sections were powered
# down. Serial output itself draws current, so use this to find where the
# current goes, not for the final number.

CONFIG_OPERATION_MODE_ONE_SHOT=y

CONFIG_NRF71_IDLE_POWER=y
CONFIG_NRF71_IDLE_POWER_RAM_RETAIN_UNUSED_ONLY=y
CONFIG_NRF71_IDLE_DIAGNOSTICS=y
