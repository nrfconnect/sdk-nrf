# Host idle current measurement (clean number).
#
# Wi-Fi is brought up, scanned once and shut down, then the host SoC idles
# forever. Serial/logging is off so the reading is not polluted by the UART
# (and its HFCLK request). Use overlay-host-idle-diag.conf instead when you
# need the register snapshot.

CONFIG_OPERATION_MODE_ONE_SHOT=y

# nRF71 idle power helpers: power down RAM the image does not use and let
# devices runtime-suspend while idle.
CONFIG_NRF71_IDLE_POWER=y
CONFIG_NRF71_IDLE_POWER_RAM_RETAIN_UNUSED_ONLY=y

# Silence the console for a clean measurement. Coredump-over-logging in
# prj.conf pulls in the logging core, so drop it here too.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_DEBUG_COREDUMP=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
