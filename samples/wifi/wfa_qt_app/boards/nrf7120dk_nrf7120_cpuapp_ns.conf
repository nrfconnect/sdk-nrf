# WFA certification: stay in VHT on 802.11ac 80 MHz APs (no VHT-to-HT fallback)
CONFIG_WIFI_NRF71_VHT_HT_FALLBACK=n

# WFA certification: QuickTrack ICMP loopback counts any non echo-reply ICMP
# packet as a loss, so suppress port unreachable errors and do not advertise
# the DUT as a gateway, which attracts background traffic from the test bed.
CONFIG_NET_DISABLE_ICMP_DESTINATION_UNREACHABLE=y
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=n
