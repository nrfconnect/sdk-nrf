# Reduced to fit the enterprise credential copies that Zephyr reserves in the
# system heap (HEAP_MEM_POOL_ADD_SIZE_HOSTAP_STA_ENTERPRISE_CREDS)
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=58000
CONFIG_WIFI_CREDENTIALS=n
# Link-time optimizations to fix flash overflow
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_WIFI_SHELL_RUNTIME_CERTIFICATES=n
