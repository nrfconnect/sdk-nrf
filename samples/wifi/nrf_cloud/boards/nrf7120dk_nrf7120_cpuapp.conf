# Bump stack size for DTLS handshake (consumed more in an S build).
CONFIG_CONNECTION_THREAD_STACK_SIZE=24576

# Disable location tracking on nRF7120 because connected scans
# cause crashes https://nordicsemi.atlassian.net/browse/WZN-10491
CONFIG_LOCATION_TRACKING=n

# Secure Storage is needed to enable the Protected Storage TLS credentials backend
# (persists TLS credentials across reboots) when TF-M is not in use.
CONFIG_SECURE_STORAGE=y
