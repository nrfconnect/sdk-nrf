# Note: even when using Protected Storage, credentials are still retrieved into insecure
# memory when in use.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y
## TF-M: keep IPC mode (default) for the MQTT build. Enable MM-IOVEC to save RAM.
CONFIG_TFM_PSA_FRAMEWORK_HAS_MM_IOVEC=y

CONFIG_TFM_CRYPTO_ASYM_SIGN_MODULE_ENABLED=y

# TF-M for nRF54LM20 unconditionally enables ITS_ENCRYPTION by default (SOC_SERIES_NRF54L).
# TF-M rejects the combination of ITS_ENCRYPTION and PSA_FRAMEWORK_HAS_MM_IOVEC (which
# prj.conf enables for TF-M RAM savings). Disable ITS encryption to resolve the conflict;
# TLS credentials are stored in PS (Protected Storage), not ITS, so this is safe.
CONFIG_TFM_ITS_ENCRYPTED=n

#NRF70 specific configuration
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NRF70_SKIP_LOCAL_ADMIN_MAC=y

# Cut flash. Needed in order to fit into application image slots.
CONFIG_NET_SHELL=n
