CONFIG_LOG=y
CONFIG_SDHC_LOG_LEVEL_DBG=y
CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_DISK_LOG_LEVEL_DBG=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2S=y

CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_TAC5112=y
CONFIG_AUDIO_DMIC=y

# SD card over SPI + FAT filesystem
# (SPI / DISK_ACCESS / DISK_DRIVER_SDMMC come from the shield's Kconfig.defconfig
#  and from the enabled devicetree nodes; FS bits are app-level.)
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=n
