sample:
  name: ADC driver sequence sample
common:
  tags:
    - ci_samples_zephyr_drivers_adc
  harness: console
  timeout: 10
  harness_config:
    type: multi_line
    regex:
      - "ADC sequence reading \\[\\d+\\]:"
      - "- .+, channel \\d+, \\d+ sequence samples:"
      - "- - \\d+ (= \\d+mV)|(\\(value in mV not available\\))"
  platform_allow:
    - nrf54ls05dk/nrf54ls05a/cpuapp
    - nrf54ls05dk/nrf54ls05b/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuapp/ns
    - nrf7120dk/nrf7120/cpuapp
    - nrf7120dk/nrf7120/cpuapp/ns
    - nrf7120dk/nrf7120e/cpuapp
    - nrf9251dk/nrf9251/cpuapp
    - nrf9251dk/nrf9251/cpuppr
  integration_platforms:
    - nrf54ls05dk/nrf54ls05b/cpuapp

tests:
  nrf.extended.sample.drivers.adc.adc_sequence: {}
  nrf.extended.sample.drivers.adc.adc_sequence.8bit:
    extra_configs:
      - CONFIG_SEQUENCE_RESOLUTION=8
