sample:
  name: Blink LED (PWM based)
common:
  tags:
    - drivers
    - pwm
    - ci_samples_zephyr_basic_blinky_pwm
  depends_on: pwm
  sysbuild: true
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "PWM-based blinky"
      - "Calibrating for channel [0-9]+"
      - "Done calibrating; maximum/minimum periods [0-9]+/[0-9]+ nsec"
      - "Using period [0-9]+"
      - "Using period [0-9]+"

tests:
  nrf.extended.sample.basic.blink_led:
    platform_allow:
      - nrf9251dk/nrf9251/cpuppr
    integration_platforms:
      - nrf9251dk/nrf9251/cpuppr
