sample:
  description: BSD Sockets API CoAP server example
  name: socket_coap_server
tests:
  nrf.extended.sample.net.sockets.coap_server.wifi-ipv4:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv4
      # HostAP crypto still uses the deprecated legacy MbedTLS symbols.
      - CONFIG_DEPRECATED_KCONFIGS_AS_ERRORS=n
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
  nrf.extended.sample.net.sockets.coap_server.wifi-ipv4.dtls:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv4
      - EXTRA_CONF_FILE="overlay-dtls.conf"
      # HostAP crypto still uses the deprecated legacy MbedTLS symbols.
      - CONFIG_DEPRECATED_KCONFIGS_AS_ERRORS=n
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
  nrf.extended.sample.net.sockets.coap_server.wifi-ipv6:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv6
      # HostAP crypto still uses the deprecated legacy MbedTLS symbols.
      - CONFIG_DEPRECATED_KCONFIGS_AS_ERRORS=n
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
  nrf.extended.sample.net.sockets.coap_server.wifi-ipv6.dtls:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv6
      - EXTRA_CONF_FILE="overlay-dtls.conf"
      # HostAP crypto still uses the deprecated legacy MbedTLS symbols.
      - CONFIG_DEPRECATED_KCONFIGS_AS_ERRORS=n
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
