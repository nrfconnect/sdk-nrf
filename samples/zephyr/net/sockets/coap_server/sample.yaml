sample:
  description: BSD Sockets API CoAP server example
  name: socket_coap_server
tests:
  nrf.extended.sample.net.sockets.coap_server.wifi-ipv4:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv4
      - platform:nrf7120:EXTRA_DTC_OVERLAY_FILE=${ZEPHYR_NRFXLIB_MODULE_DIR}/nrf71_wifi/bins/0.1.0/nrf7120_wifi_patch.dtsi
      - platform:nrf7120:CONFIG_WIFI_NRF71_PATCH=y
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
  nrf.extended.sample.net.sockets.coap_server.wifi-ipv4.dtls:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv4
      - EXTRA_CONF_FILE="overlay-dtls.conf"
      - platform:nrf7120:EXTRA_DTC_OVERLAY_FILE=${ZEPHYR_NRFXLIB_MODULE_DIR}/nrf71_wifi/bins/0.1.0/nrf7120_wifi_patch.dtsi
      - platform:nrf7120:CONFIG_WIFI_NRF71_PATCH=y
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
  nrf.extended.sample.net.sockets.coap_server.wifi-ipv6:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv6
      - platform:nrf7120:EXTRA_DTC_OVERLAY_FILE=${ZEPHYR_NRFXLIB_MODULE_DIR}/nrf71_wifi/bins/0.1.0/nrf7120_wifi_patch.dtsi
      - platform:nrf7120:CONFIG_WIFI_NRF71_PATCH=y
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
  nrf.extended.sample.net.sockets.coap_server.wifi-ipv6.dtls:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv6
      - EXTRA_CONF_FILE="overlay-dtls.conf"
      - platform:nrf7120:EXTRA_DTC_OVERLAY_FILE=${ZEPHYR_NRFXLIB_MODULE_DIR}/nrf71_wifi/bins/0.1.0/nrf7120_wifi_patch.dtsi
      - platform:nrf7120:CONFIG_WIFI_NRF71_PATCH=y
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
