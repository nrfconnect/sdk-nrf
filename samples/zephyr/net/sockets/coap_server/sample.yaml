sample:
  description: BSD Sockets API CoAP server example
  name: socket_coap_server
common:
  extra_args:
    - CONF_FILE="${ZEPHYR_BASE}/samples/net/sockets/coap_server/prj.conf"
tests:
  nrf.extended.sample.net.sockets.coap_server.wifi:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv4
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
  nrf.extended.sample.net.sockets.coap_server.wifi.dtls:
    tags:
      - ci_build
      - sysbuild
      - ci_samples_net
    extra_args:
      - SNIPPET=wifi-ipv4
      - EXTRA_CONF_FILE="dtls.conf"
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp
      - nrf7120dk/nrf7120/cpuapp
