CONFIG_MULTITHREADING=n
CONFIG_KERNEL_MEM_POOL=n
CONFIG_NUM_PREEMPT_PRIORITIES=0
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_ARM_MPU=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_I2C=n
CONFIG_WATCHDOG=n
CONFIG_GPIO=n
CONFIG_SPI=n
CONFIG_SERIAL=n
CONFIG_FLASH=n
CONFIG_DYNAMIC_INTERRUPTS=n
CONFIG_IRQ_OFFLOAD=n
# Ineffective here: THREAD_STACK_INFO is selected by the enabled stack protection, so it stays y.
# CONFIG_THREAD_STACK_INFO=n
CONFIG_THREAD_CUSTOM_DATA=n
CONFIG_BOOT_BANNER=n
# Ineffective here: unsatisfied dependency MULTITHREADING, so BOOT_DELAY stays unset.
# CONFIG_BOOT_DELAY=0
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
# Ineffective here: PRINTK is selected by NCS_BOOT_BANNER, so it stays y.
# CONFIG_PRINTK=n
# Ineffective here: EARLY_CONSOLE is selected by NCS_BOOT_BANNER, so it stays y.
# CONFIG_EARLY_CONSOLE=n
CONFIG_SOC_NRF53_CPUNET_ENABLE=y
