sample:
  description: Event-driven RTFW GPIOTE input with Bluetooth HIDS delivery
  name: RTFW HID

tests:
  sample.rtfw.hid.nrf54l:
    build_only: true
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    tags:
      - bluetooth
      - rtfw

  sample.rtfw.hid.nrf54l.instrumentation:
    build_only: true
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    extra_configs:
      - CONFIG_SAMPLE_RTFW_DEBUG_PIN=y
      - CONFIG_SAMPLE_RTFW_ISR_TEST_LOAD=y
    tags:
      - bluetooth
      - rtfw

  sample.rtfw.hid.nrf54h20:
    sysbuild: true
    build_only: true
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
    tags:
      - bluetooth
      - rtfw

  sample.rtfw.hid.nrf54h20.instrumentation:
    sysbuild: true
    build_only: true
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    extra_configs:
      - CONFIG_SAMPLE_RTFW_DEBUG_PIN=y
      - CONFIG_SAMPLE_RTFW_ISR_TEST_LOAD=y
    tags:
      - bluetooth
      - rtfw
