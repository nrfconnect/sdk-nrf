CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_RTFW=y
CONFIG_RTFW_COMMAND_DATA_SIZE=4
CONFIG_ZERO_LATENCY_IRQS=y
CONFIG_ZERO_LATENCY_LEVELS=2
CONFIG_GPIO=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_RTFW_HID"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=1
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=16
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=24
CONFIG_BT_GATT_CHRC_POOL_SIZE=12
CONFIG_BT_CONN_CTX=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_RTFW_WORKQ_STACK_SIZE=3072
