sample:
  description: Event-driven RTFW GPIOTE input with Bluetooth HIDS delivery
  name: RTFW HID

common:
  sysbuild: true
  tags:
    - bluetooth
    - rtfw
    - ci_samples_subsys_rtfw
  platform_allow:
    - nrf54h20dk/nrf54h20/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
  integration_platforms:
    - nrf54h20dk/nrf54h20/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
  harness: console
  harness_config:
    ordered: true
    regex:
      - "Starting event-driven RTFW HID/GPIOTE backend"
      - "HID advertising start"
    type: multi_line

tests:
  sample.rtfw.hid: {}
  sample.rtfw.hid.instrumentation:
    extra_configs:
      - CONFIG_SAMPLE_RTFW_DEBUG_PIN=y
      - CONFIG_SAMPLE_RTFW_ISR_TEST_LOAD=y
