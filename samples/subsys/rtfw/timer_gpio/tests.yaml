sample:
  description: Event-driven RTFW TIMER/GPIO diagnostic backend
  name: RTFW timer GPIO

common:
  sysbuild: true
  tags:
    - rtfw
    - ci_samples_subsys_rtfw
  platform_allow:
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf54h20dk/nrf54h20/cpuapp
  integration_platforms:
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf54h20dk/nrf54h20/cpuapp
  harness: console
  harness_config:
    regex:
      - "Starting event-driven RTFW timer/GPIO backend"
    type: multi_line

tests:
  sample.rtfw.timer_gpio: {}
  sample.rtfw.timer_gpio.data_plane:
    extra_configs:
      - CONFIG_SAMPLE_RTFW_TIMER_TELEMETRY_DECIMATION=16
  sample.rtfw.timer_gpio.instrumentation:
    extra_configs:
      - CONFIG_SAMPLE_RTFW_DEBUG_PIN=y
      - CONFIG_SAMPLE_RTFW_ISR_TEST_LOAD=y
