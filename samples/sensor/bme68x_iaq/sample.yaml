sample:
  name: BME68X Sensor Sample
tests:
  sample.sensor.bme68x.i2c:
    sysbuild: true
    depends_on: i2c
    harness: sensor
    integration_platforms:
      - thingy91x/nrf9151
      - thingy91x/nrf9151/ns
    platform_allow:
      - thingy91x/nrf9151
      - thingy91x/nrf9151/ns
    tags:
      - sensors
      - sysbuild
      - ci_samples_sensor
  sample.sensor.bme68x.polling:
    sysbuild: true
    depends_on: i2c
    integration_platforms:
      - thingy91x/nrf9151
      - thingy91x/nrf9151/ns
    extra_args: CONFIG_APP_TRIGGER=n
    platform_allow:
      - thingy91x/nrf9151
      - thingy91x/nrf9151/ns
    tags:
      - sensors
      - sysbuild
      - ci_samples_sensor
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "(\\d+\\.\\d+); press: (\\d+\\.\\d+); humidity: (\\d+\\.\\d+); iaq: (\\\
        d+)"
