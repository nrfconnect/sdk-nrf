# Variant of overlay-etb.conf for SoCs without an ETB. ETB_TRACE depends on
# SOC_SERIES_NRF91, and ETB_TRACE_LOW_POWER and MEMFAULT_NCS_ETB_CAPTURE depend
# on ETB_TRACE in turn, so those three settings cannot be applied here. Only the
# logging reduction is kept so the build stays comparable to the nRF91 one.
CONFIG_FAULT_DUMP=0
CONFIG_KERNEL_LOG_LEVEL_OFF=y
