CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_PSA_CRYPTO=y
# Ineffective here: PSA_CRYPTO_DRIVER_OBERON has no prompt once TF-M protected storage or built-in
# keys are in use, so it keeps its default and cannot be assigned.
# CONFIG_PSA_CRYPTO_DRIVER_OBERON=y
CONFIG_PSA_WANT_ALG_JPAKE=y
CONFIG_PSA_WANT_ALG_TLS12_ECJPAKE_TO_PMS=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_PASSWORD=y

CONFIG_MAIN_STACK_SIZE=8192
