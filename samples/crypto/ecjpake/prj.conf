CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_PSA_CRYPTO=y
# Ineffective here: PSA_CRYPTO_DRIVER_OBERON has no prompt once TF-M protected storage is used, so
# it keeps its default n on the CRACEN _ns targets; on all other targets its default is already y
# where CRACEN is not enabled, and the CRACEN board files set it to n.
# CONFIG_PSA_CRYPTO_DRIVER_OBERON=y
CONFIG_PSA_WANT_ALG_JPAKE=y
CONFIG_PSA_WANT_ALG_TLS12_ECJPAKE_TO_PMS=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_PASSWORD=y

CONFIG_MAIN_STACK_SIZE=8192
