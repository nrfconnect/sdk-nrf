# Extra conf file that enables DTLS using mutual X.509 authentication.

# Enable DTLS
CONFIG_COAP_SAMPLE_DTLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1

# mbedTLS
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=80000
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_MPI_MAX_SIZE=512

# ECDHE-ECDSA ciphersuite matching the Californium server
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y

# PSA crypto — ECDSA + ECDH over P-256 for the cert handshake
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_COAP_CLIENT_STACK_SIZE=6144
