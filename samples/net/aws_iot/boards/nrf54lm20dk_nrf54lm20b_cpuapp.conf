# Secure Storage is needed to enable the Protected Storage TLS credentials backend
# (persists TLS credentials across reboots) when TF-M is not in use.
CONFIG_SECURE_STORAGE=y

# Increase the maximum data size for Secure Storage to accommodate the TLS credentials.
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=1708

# Secure Storage stores its data through Settings on ZMS.
CONFIG_FLASH=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# Larger network buffer pools to avoid allocation failures during TLS traffic.
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=8192
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=8192
