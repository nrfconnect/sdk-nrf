# MCUboot config to enable secondary slot on the external flash

# General
CONFIG_FLASH=y
CONFIG_MAIN_STACK_SIZE=4096

# SPI
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# MCUboot
# Ineffective here: unsatisfied dependency !BOOT_MAX_IMG_SECTORS_AUTO, so BOOT_MAX_IMG_SECTORS stays
# unset and the sector count is calculated automatically.
# CONFIG_BOOT_MAX_IMG_SECTORS=512
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
# Ineffective here: unsatisfied dependency SOC_FLASH_NRF; nRF54LM20 uses the RRAM flash driver
# (SOC_FLASH_NRF_RRAM), so this option stays n.
# CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y
