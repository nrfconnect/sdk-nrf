# Logging and shell
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_LOG_CMDS=y
CONFIG_I2C_SHELL=y
CONFIG_LED_SHELL=y

# nPM10 drivers
CONFIG_CHARGER=y
CONFIG_MFD=y
CONFIG_SENSOR=y
CONFIG_LED=y
CONFIG_GPIO=y
CONFIG_WATCHDOG=y

# nRF Fuel Gauge lib
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_MAIN_STACK_SIZE=1536

# Persistent fuel gauge state
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_SHELL=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE=y
