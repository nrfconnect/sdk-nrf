sample:
  name: Bootloader Sample
tests:
  sample.bootloader:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf9160dk/nrf9160
      - nrf9161dk/nrf9161
      - nrf9151dk/nrf9151
      - nrf54l15dk/nrf54l15/cpuapp
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf9160dk/nrf9160
      - nrf9161dk/nrf9161
      - nrf9151dk/nrf9151
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - DTC_OVERLAY_FILE="app_test.overlay"
    tags:
      - ci_build
      - sysbuild
      - ci_samples_bootloader
