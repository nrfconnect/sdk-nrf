sample:
  name: CUSTOMER UICR Sample
  description: |
    Sample demonstrating UICR.CUSTOMER to store persistent data.
    The sample adds a customer.bin file to the uicr image, which
    will then build with the customer data as part of the uicr.hex.

common:
  sysbuild: true
  harness: console
  harness_config:
    type: multi_line
    regex:
      # deadbeef is the word we write. Then the UICR magic words x3.
      - ".*deadbeef bd2328a8 bd2328a8 bd2328a8 .*"

tests:
  samples.ironside_se.customer_uicr:
    tags:
      - sysbuild
      - ci_samples_sdfw
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    timeout: 7
