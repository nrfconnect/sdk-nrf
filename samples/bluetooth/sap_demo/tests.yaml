sample:
  name: Secure Application Pairing
tests:
  sample.bluetooth.sap.central:
    sysbuild: true
    extra_args:
      - EXTRA_CONF_FILE=central.conf
    platform_allow: &sap_platforms
      - nrf52dk/nrf52832
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpuapp/ns
      - nrf54l15dk/nrf54l05/cpuapp
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp/ns
    integration_platforms:
      - nrf52840dk/nrf52840
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - bluetooth
      - ci_build
      - crypto
      - sysbuild
      - ci_samples_bluetooth
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "SAP sample starting as central, local device id"
        - "Scanning started"
    timeout: 15
  sample.bluetooth.sap.peripheral:
    sysbuild: true
    extra_args:
      - EXTRA_CONF_FILE=peripheral.conf
    platform_allow: *sap_platforms
    integration_platforms:
      - nrf52840dk/nrf52840
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - bluetooth
      - ci_build
      - crypto
      - sysbuild
      - ci_samples_bluetooth
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "SAP sample starting as peripheral, local device id"
        - "Advertising started"
    timeout: 15
