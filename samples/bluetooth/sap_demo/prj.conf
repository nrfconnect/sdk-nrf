CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_BT_SAP=y
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_PRIVACY=y
CONFIG_BT_DEVICE_NAME="SAP"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
CONFIG_BT_LONG_WQ_STACK_SIZE=2048
# SAP_REQUIRED_ATT_MTU is 283 with the default 128-byte app payload.
CONFIG_BT_L2CAP_TX_MTU=283
CONFIG_BT_BUF_ACL_RX_SIZE=287
CONFIG_BT_BUF_ACL_TX_SIZE=287
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_BT_SAP_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_ENTROPY_GENERATOR=y
