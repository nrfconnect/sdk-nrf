CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
# Also act as a peripheral so a host can connect and upload the update image
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_EXT_ADV=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_DFU_SMP=y
CONFIG_BT_DEVICE_NAME="SMP Client Sample"

CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1

# The ATT MTU and NETBUF size may be increased further to improve throughput
# at the cost of increased RAM usage. The DFU target must also be configured
# to support the same values for this to have any effect.
# Alternative configuration values for maximum throughput:
# CONFIG_BT_L2CAP_TX_MTU=498
# CONFIG_BT_BUF_ACL_RX_SIZE=502
# CONFIG_BT_BUF_ACL_TX_SIZE=502
# CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_AUTO_PHY_CENTRAL_2M=y
# As Zephyr's mcumgr image management client sets the max. SMP frame size
# based on the netbuf size, the DFU target must enable CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY
# and set its own CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE to match this value.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1220
# Uncomment line below to enable logging of SMP requests and responses.
#CONFIG_MCUMGR_SMP_CLIENT_LOG_LEVEL_DBG=y

CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y

CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_SMP_CLIENT=y
CONFIG_MCUMGR_GRP_IMG_CLIENT=y
CONFIG_MCUMGR_GRP_OS_CLIENT=y
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_SMP=y
CONFIG_DFU_TARGET_SMP_TRANSPORT_BT=y

# Enable LittleFS for the file storage.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# Mount the LittleFS partition defined in the devicetree fstab node at boot.
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=y

CONFIG_MAIN_STACK_SIZE=2048

# Enable mcumgr SMP server over BLE with the file management group,
# so we can upload the update image to the LittleFS partition.
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
# Without the file access hook, the file management group grants a connected
# mcumgr client access to every file in the file system. The hook lets the
# application restrict the access to the update image only.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y

CONFIG_DK_LIBRARY=y
