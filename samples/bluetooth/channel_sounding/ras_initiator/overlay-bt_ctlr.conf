# Controller settings for boards that build the SoftDevice Controller into this
# image. Boards with a dedicated radio core (nRF54H) run the controller in the
# ipc_radio image instead, so HAS_BT_CTLR and BT_LL_SOFTDEVICE are not set in
# the application image and these lines have no effect there.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_SDC_CS_ROLE_INITIATOR_ONLY=y
