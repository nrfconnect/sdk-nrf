CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_ASSERT=y
# Ineffective here: unsatisfied dependency ARCH_STACKWALK, so EXCEPTION_STACK_TRACE stays n.
# CONFIG_EXCEPTION_STACK_TRACE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_MAX_CONN=16
CONFIG_BT_PERIPHERAL=n
# Ineffective here: this is a host option and this image runs the controller only, so BT_HCI_HOST is
# not set; the controller side is enabled on the next line.
# CONFIG_BT_SCAN_AND_INITIATE_IN_PARALLEL=y
CONFIG_BT_CTLR_SDC_ALLOW_PARALLEL_SCANNING_AND_INITIATING=y
CONFIG_BT_CTLR_FAL_SIZE=255

CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
