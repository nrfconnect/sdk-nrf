CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_SCAN_AND_INITIATE_IN_PARALLEL=y
# Ineffective here: unsatisfied dependency BT_LL_SOFTDEVICE, so
# BT_CTLR_SDC_ALLOW_PARALLEL_SCANNING_AND_INITIATING stays n.
# CONFIG_BT_CTLR_SDC_ALLOW_PARALLEL_SCANNING_AND_INITIATING=y

# A ring buffer is used as a device address cache
CONFIG_RING_BUFFER=y

# Ineffective here: unsatisfied dependency ((BT_LL_SOFTDEVICE && BT) ||
# (BT_CTLR_FILTER_ACCEPT_LIST && HAS_BT_CTLR && BT_HCI && BT)), so BT_CTLR_FAL_SIZE stays unset.
# CONFIG_BT_CTLR_FAL_SIZE=255

CONFIG_LOG=y

CONFIG_BT_MAX_CONN=16
