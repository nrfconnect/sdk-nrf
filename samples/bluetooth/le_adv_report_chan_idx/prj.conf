CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="adv_report_with_chan_idx"

# Host support for channel index in standard LE Advertising Report
CONFIG_BT_HCI_ADV_REPORT_CHAN_IDX=y

# SoftDevice Controller support for advertising report with channel index
CONFIG_BT_CTLR_SDC_CHAN_IDX_IN_ADV_REPORT=y
