# Logging for the MCUboot image. It is kept out of prj.conf because the
# thingy53 board fragment in this directory switches logging off to save flash,
# and the settings below only exist while logging is enabled.

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
### Ensure Zephyr logging changes don't use more resources
CONFIG_LOG_DEFAULT_LEVEL=0

# NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MCUboot"
