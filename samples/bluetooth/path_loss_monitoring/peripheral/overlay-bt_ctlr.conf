# Controller settings for boards that build the SoftDevice Controller into this
# image. Boards with a dedicated radio core run the controller in the ipc_radio
# image instead, so HAS_BT_CTLR and the BT_CTLR_* symbols do not exist in the
# application image and these lines have no effect there.
CONFIG_BT_CTLR_LE_POWER_CONTROL=y
