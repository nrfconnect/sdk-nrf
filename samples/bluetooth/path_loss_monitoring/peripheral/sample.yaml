sample:
  name: Bluetooth LE Peripheral Path Loss Monitoring Sample

common: &common
  sysbuild: true
  build_only: true
  tags:
    - bluetooth
    - ci_build
    - sysbuild
    - ci_samples_bluetooth

tests:
  sample.bluetooth.peripheral_path_loss_monitoring:
    <<: *common
    extra_args: EXTRA_CONF_FILE=overlay-bt_ctlr.conf
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
  # Split off from sample.bluetooth.peripheral_path_loss_monitoring: these boards
  # run the SoftDevice Controller in the separate ipc_radio image, so the
  # BT_CTLR_* settings in overlay-bt_ctlr.conf have no effect in the application
  # image.
  sample.bluetooth.peripheral_path_loss_monitoring.ipc_radio:
    <<: *common
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
