# Save some RAM to fit ipc_radio application
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_MAIN_STACK_SIZE=1024

# To present the audio at the right point in time, we need the controller and
# audio clock to be synchronized. The trigger is an nRF5340 network core
# feature, so it is configured per board instead of in prj.conf.
CONFIG_MPSL_TRIGGER_IPC_TASK_ON_RTC_START=y
CONFIG_MPSL_TRIGGER_IPC_TASK_ON_RTC_START_CHANNEL=4
