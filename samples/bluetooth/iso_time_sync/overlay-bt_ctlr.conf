# Controller settings for boards that build the SoftDevice Controller into this
# image. Boards with a dedicated radio core (nRF53, nRF54H) run the controller
# in the ipc_radio image instead, so BT_LL_SOFTDEVICE and the BT_CTLR_* symbols
# do not exist in the application image and these lines have no effect there.
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=4
