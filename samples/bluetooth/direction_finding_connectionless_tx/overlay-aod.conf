# Enable AoD Feature (antenna switching) in Tx mode in the Host
# Ineffective here: unsatisfied dependencies BT_CTLR_DF_CTE_TX, BT_CTLR_DF, HAS_BT_CTLR, so
# BT_CTLR_DF_ANT_SWITCH_TX stays n whenever this overlay is applied to an image without the
# controller; moved to overlay-aod-ctlr.conf, which is applied to the image that holds it.
# CONFIG_BT_CTLR_DF_ANT_SWITCH_TX=y
CONFIG_BT_DF_CTE_TX_AOD=y
