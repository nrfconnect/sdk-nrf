# Controller part of the AoD configuration. It belongs to the image that holds
# the Bluetooth controller: the application image on single-core boards, and the
# ipc_radio image on boards with a dedicated radio core (nRF53). In an image
# without the controller, HAS_BT_CTLR is not set and this line has no effect.
CONFIG_BT_CTLR_DF_ANT_SWITCH_TX=y
