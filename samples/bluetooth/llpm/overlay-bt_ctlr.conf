# Controller settings for boards that build the SoftDevice Controller into this
# image. Boards with a dedicated radio core (nRF54H) run the controller in the
# ipc_radio image instead, so BT_LL_SOFTDEVICE is not set in the application
# image and this line has no effect there.
CONFIG_BT_CTLR_SDC_QOS_CONN_EVENT_REPORT=y
