# hci_uart_async
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_POLL=y

# hci_raw (dependency of hci_uart)
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y

# See `overlay.app`. The 'zephyr,console' chosen node is deleted there
# in case it has a interfering default. Those same boards set this
# config and it must be undone or the build will fail.
CONFIG_UART_CONSOLE=n

# UTP over HCI
CONFIG_BT_CTLR_SDC_UTP_HCI=y

# UTP OTA
CONFIG_BT_CTLR_SDC_UTP_OTA=y

# Nordic UTP additions
CONFIG_BT_CTLR_SDC_UTP_VS_NORDIC=y

# DTM over HCI
CONFIG_BT_CTLR_DTM_HCI=y
