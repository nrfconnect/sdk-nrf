sample:
  description: Sample showing how to configure VTF monitoring subsystem
  name: VTF monitoring sample

common:
  sysbuild: true
  build_only: true
  integration_platforms:
    - nrf7120dk/nrf7120/cpuapp
  platform_allow:
    - nrf7120dk/nrf7120/cpuapp
  tags:
    - ci_build
    - sysbuild
    - ci_samples_vtf_monitoring

tests:
  sample.vtf_monitoring: {}
  sample.vtf_monitoring.battery_override:
    extra_configs:
      - CONFIG_VTF_BATTERY_VOLTAGE_MONITOR=n
      - CONFIG_SAMPLE_VTF_CUSTOM_BATTERY_VOLTAGE_MONITOR=y
