CONFIG_LOCATION_METHOD_WIFI=y
# Set default passive scan time so, that it's long enough for two beacons
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_DWELL_TIME_PASSIVE=260
# Exclude channel 14 by default, since it's only used in Japan
CONFIG_LOCATION_METHOD_WIFI_SCANNING_CHANNELS_MAX=13
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_CHANNELS="2:1-13"

# nRF Cloud CoAP location requests include at most 20 access points
CONFIG_LOCATION_METHOD_WIFI_SCANNING_RESULTS_MAX_CNT=20
CONFIG_LOCATION_WORKQUEUE_STACK_SIZE=8192

# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_NRF92=y

# Networking
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_DUMMY=y
CONFIG_NET_OFFLOAD=y

# Memory configurations
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
