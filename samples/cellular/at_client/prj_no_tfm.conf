#
# Base configuration for targets that build without TF-M, used through
# FILE_SUFFIX=no_tfm.
#
# It differs from prj.conf in the TF-M profile only. The other platforms of this
# sample are non-secure targets where TF-M is part of the build and the minimal
# profile has to be selected, while nrf9251dk builds the application on its own.
# There the TF-M profile choice does not exist, so a single base configuration
# cannot serve both.

# TF-M config
# Ineffective on this target: the TF-M profile choice is only available for the
# non-secure targets that actually build TF-M.
# CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General config
CONFIG_ASSERT=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# Modem library
CONFIG_NRF_MODEM_LIB=y

# AT host library
CONFIG_AT_HOST_LIBRARY=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Stacks and heaps
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_AT_MONITOR_HEAP_SIZE=512
