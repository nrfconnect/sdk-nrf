CONFIG_POSIX_API=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
# TLS/HTTP over PPP needs more than the default 4 packets / 16 buffers of 128 bytes
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_RCVTIMEO=y

# DNS
CONFIG_DNS_RESOLVER=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y

# Network management
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# Modem driver
CONFIG_MODEM=y
CONFIG_PM_DEVICE=y
CONFIG_MODEM_CELLULAR=y

# Dynamic APN configuration (uncomment if not needed)
#CONFIG_MODEM_CELLULAR_APN="" # Remove default APN
#CONFIG_SAMPLE_CELLULAR_MODEM_AUTO_APN=y
#CONFIG_SAMPLE_CELLULAR_APN_0="shared.m2m.ch"
#CONFIG_SAMPLE_CELLULAR_IMSI_LIST_0="22801"
#CONFIG_SAMPLE_CELLULAR_APN_1="em"
#CONFIG_SAMPLE_CELLULAR_IMSI_LIST_1="29505 90143 29509"

# Statistics
CONFIG_MODEM_STATS=y
CONFIG_SHELL=y

# Testing
CONFIG_MODEM_AT_SHELL=y
CONFIG_MODEM_CELLULAR_SHELL=y
CONFIG_PM_DEVICE_SHELL=y
CONFIG_SHELL_WILDCARD=n

# MCUboot image confirmation
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_DFU_TARGET_MCUBOOT=y

# Logging
CONFIG_LOG=y
CONFIG_MODEM_MODULES_LOG_LEVEL_INF=y
# For extra verbosity
#CONFIG_MODEM_CMUX_LOG_LEVEL_DBG=y
#CONFIG_LOG_BUFFER_SIZE=65536

# Memfault
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_HTTP_ENABLE=y
# Get your project key from Memfault: Settings -> Project Key
CONFIG_MEMFAULT_PROJECT_KEY=""
# Device ID is the nRF9151 IMEI, set at runtime via memfault_ncs_device_id_set()
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=y

# No coredumps or default LTE metrics in this minimal sample
CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP=n
CONFIG_MEMFAULT_NCS_LTE_METRICS=n

# TLS to Memfault is terminated on this MCU, the modem only carries PPP.
# Crypto settings follow ncs-serial-modem-host-applications/applications/ppp/prj.conf
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
# Memfault installs 2 root certs
CONFIG_NET_SOCKETS_TLS_MAX_CREDENTIALS=4
CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=24576
# HTTPS server certificate records are larger than the 2048 used for CoAP
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_DECLARE_PRIVATE_IDENTIFIERS=y

# TLS 1.2 needs at least one key exchange / ciphersuite
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y

# PSA algorithms for certificate chain verification
# Random number generation for the TLS handshake (client random, ephemeral keys)
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_SHA_224=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y

# DNS fallbacks in case PPP does not provide servers
CONFIG_DNS_RESOLVER_MAX_SERVERS=4
# Must be >= the number of DNS servers the dispatcher polls
CONFIG_ZVFS_POLL_MAX=8
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_DNS_SERVER2="1.1.1.1"

CONFIG_HEAP_MEM_POOL_SIZE=16384
# TLS handshake and certificate verification run on the main thread
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# Temporary: TLS handshake debugging
# CONFIG_NET_LOG=y
# CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
# CONFIG_LOG_BUFFER_SIZE=8192
# CONFIG_MBEDTLS_DEBUG=y
# CONFIG_MBEDTLS_LOG_LEVEL_DBG=y
# CONFIG_MEMFAULT_LOG_LEVEL_DBG=y

CONFIG_ZCBOR=y

# OTA bundle download to the /ota file system (external flash)
CONFIG_DOWNLOADER=y
CONFIG_DOWNLOADER_TRANSPORT_HTTP=y
CONFIG_DOWNLOADER_STACK_SIZE=4096
CONFIG_DOWNLOADER_MAX_HOSTNAME_SIZE=64
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=256
