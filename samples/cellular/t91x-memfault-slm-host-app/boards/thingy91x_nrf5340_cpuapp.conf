CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# The nRF91 SLM driver exposes gnss_pipe, not user_pipe_0 required by AT shell.
CONFIG_MODEM_AT_SHELL=n
CONFIG_I2C_SHELL=y
# Match the SLM CMUX settings (ncs-serial-modem/app/cmux.conf)
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=399

# OTA bundle storage on external flash (LittleFS at /ota)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
