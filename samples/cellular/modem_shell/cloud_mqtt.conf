# Modem Shell
CONFIG_MOSH_CLOUD_MQTT=y
CONFIG_MOSH_CLOUD_COAP=n

# Report standard information to shadow. These need a cloud transport, so each
# transport fragment carries them instead of the shared prj.conf.
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS=y
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_NETWORK=y
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_SIM=y
