# Settings that depend on features which are not present on every supported
# board target: system poweroff needs SoC support, and the NVS log level only
# exists where NVS is the settings backend.

# Device power management
CONFIG_POWEROFF=y

# Settings
CONFIG_NVS_LOG_LEVEL_WRN=y
