#
# TF-M logging. Both symbols need TF-M logging to be enabled, so they cannot be
# assigned from the shared prj.conf: modem_fota_full.conf silences TF-M logging
# to fit the minimal profile, and board targets that run without TF-M do not
# have these symbols at all.

# Enable TF-M logging on UART0
CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y
