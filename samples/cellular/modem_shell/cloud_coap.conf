# Tuning for the nRF Cloud CoAP transport selected by MOSH_CLOUD_COAP. The
# LwM2M, MQTT-only and non-offloading variants clear MOSH_CLOUD_COAP, which
# leaves NRF_CLOUD_COAP and COAP_CLIENT unset, so these symbols cannot be
# assigned from the shared prj.conf.

# Zephyr CoAP client
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=80

# Report standard information to shadow
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS=y
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_NETWORK=y
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_SIM=y
