#
# Lab overlay: short RA router_lifetime + faster periodic RAs (for GW scripts).
#
# Example:
#   -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;eth_ra_test_short_lifetime.conf"
#
# GW script: RL=00:02:00 jumps back when Windows applies a new RA.
# Brief GONE lines may still appear on Windows NUD (~30 s with default REACHABLE_TIME).

CONFIG_DECT_TETHER_IPV6_RA_ROUTER_LIFETIME=120
CONFIG_DECT_TETHER_IPV6_RA_UNSOLICIT_MS=30000
