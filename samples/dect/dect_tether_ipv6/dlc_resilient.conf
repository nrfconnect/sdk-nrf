#
# Loss-resilient DLC profile for dect_tether_ipv6 (PT side).
#
# Append last in EXTRA_CONF_FILE, e.g.:
#   eth_common.conf;eth_w5500.conf;dlc_resilient.conf
#
# Why: the stock DLC defaults (60 s lifetime, release on first discard)
# don't suit a tether deployment. Applied to the PT's flow_config[0]
# (PT->FT uplink) at association:
#
#   * SDU lifetime = 1.5 s (NRF_MODEM_DECT_DLC_SDU_LIFETIME_1_5_S = 21):
#     large enough to absorb a few DLC retransmission rounds without
#     dropping queued payload, small enough that a broken link surfaces
#     in seconds. Lower for latency-sensitive workloads instead.
#
#   * discard_release_assoc_count = 20: release only after 20 consecutive
#     DLC_DISCARD_TIMER_EXPIRED responses (counter resets on successful
#     TX); ~30 s worst case at the lifetime above. 0 = never release. The
#     matching FT-side overlay (dect_shell) uses 2.5 s; the two sides do
#     NOT need matching values.
#
# Both are runtime-tunable via the DECT L2 shell:
#   uart:~$ dect sett --dlc_sdu_lifetime 21
#   uart:~$ dect sett --dlc_discard_release_assoc_count 20
#   uart:~$ dect sett --read
#
# Valid sdu_lifetime: 1..31 (0.5 ms..60 s) or 255 for INFINITY.

CONFIG_DECT_MDM_NRF_DLC_SDU_LIFETIME=21
CONFIG_DECT_MDM_NRF_DLC_DISCARD_TIMER_RELEASE_ASSOC_COUNT=20
