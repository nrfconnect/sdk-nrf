# mDNS-on-Ethernet tuning for dect_tether_ipv6. Merge after :file:`eth_common.conf`,
# shield-specific :file:`eth_*.conf`, :file:`mdns-common.conf`, and :file:`mdns.conf`.
#
# From the sample directory:
#   cd nrf/samples/dect/dect_tether_ipv6
#   west build -p -b nrf9151dk/nrf9151/ns --
#     -DSHIELD=arceli_eth_w5500
#     -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;mdns-common.conf;mdns.conf;eth_mdns.conf"
#     -DEXTRA_DTC_OVERLAY_FILE=w5500-static-mac.overlay
#
# With eth0 <-> dect0 mDNS tap, also merge mdns_forward.conf after this file.

# Unicast DNS on eth0 + scoped mDNS on dect0 (order: unicast first, then mDNS).
CONFIG_DNS_RESOLVER_MAX_SERVERS=3
CONFIG_DNS_SERVER1="2001:4860:4860::8888%eth0"
CONFIG_DNS_SERVER2="2001:4860:4860::8844%eth0"
CONFIG_DNS_SERVER3="[ff02::fb]:5353%dect0"

# mdns-common.conf sets CONFIG_ZVFS_POLL_MAX=10; dect0 + eth0 and three scoped DNS
# servers need more dispatcher poll slots or dns_resolve_init returns -EAGAIN.
CONFIG_ZVFS_POLL_MAX=16
