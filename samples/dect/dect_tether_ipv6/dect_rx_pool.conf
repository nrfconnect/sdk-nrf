#
# DECT-private RX net_pkt/net_buf pool for dect_tether_ipv6.
#
# Append last in EXTRA_CONF_FILE, e.g.
#   eth_common.conf;eth_w5500.conf;dect_rx_pool.conf
#
# Why: this sample acts as the PT — DECT TX is the hot path (PC eth0 RX ->
# DECT TX uplink to FT), so the modem SHMEM split in prj.conf is
# TX-heavy. However, sustained PC->server uplink generates back-to-back
# TCP ACK bursts that arrive as small (60-96 B) DECT RX frames; those
# bursts saturate the private slab faster than the DLC RX thread can
# drain it. Sizing here is for burst depth (PKT_COUNT), not byte volume —
# fragment count can stay close to 1:1 since ACK-sized frames fit in one
# 256 B fragment.
#
# Tune _PKT_COUNT / _BUF_COUNT / _BUF_SIZE if "dect_mdm rx_pool" shows
# MaxUsed == Total under sustained PC->server traffic.
#
# Runtime inspection:
#   uart:~$ dect_mdm rx_pool

CONFIG_DECT_MDM_RX_PRIVATE_POOL=y

CONFIG_DECT_MDM_RX_PRIVATE_PKT_COUNT=35
CONFIG_DECT_MDM_RX_PRIVATE_BUF_COUNT=50
CONFIG_DECT_MDM_RX_PRIVATE_BUF_SIZE=128

# RX pipeline queues (event slab + msgq) must exceed PRIVATE_PKT_COUNT to
# avoid head-of-line blocking when the slab is fully in flight.
CONFIG_DECT_MDM_NRF_RX_EVENT_POOL_COUNT=40
CONFIG_DECT_MDM_NRF_RX_MSGQ_SIZE=40

# Visibility for the "dect_mdm rx_pool" shell:
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y
