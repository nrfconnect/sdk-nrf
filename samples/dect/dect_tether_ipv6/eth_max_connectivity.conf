# Maximum-connectivity timer overlay for dect_tether_ipv6.
#
# Include AFTER eth_common.conf to override its test-oriented defaults:
#   -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;eth_max_connectivity.conf"
#
# DO NOT include eth_unsol_na.conf together with this file unless you need it.
#
# Long REACHABLE_TIME and router/DHCP lifetimes reduce how often hosts run NUD
# and how often router_lifetime must be refreshed. Periodic multicast RAs
# (RA_UNSOLICIT_MS, default 60 s) remain the only RA refresh path.

# RFC 4861 §6.2.1 maximum: 3 600 000 ms.
CONFIG_DECT_TETHER_IPV6_RA_REACHABLE_TIME_MS=3600000

# RFC 4861 §4.2 maximum: 65535 s (~18 h).
CONFIG_DECT_TETHER_IPV6_RA_ROUTER_LIFETIME=65535

# DHCPv6 lease timers aligned with a long-running session.
CONFIG_DECT_TETHER_IPV6_DHCPV6_ADDR_PREFERRED_LIFETIME=86400
CONFIG_DECT_TETHER_IPV6_DHCPV6_ADDR_VALID_LIFETIME=172800
CONFIG_DECT_TETHER_IPV6_DHCPV6_T1=1800
CONFIG_DECT_TETHER_IPV6_DHCPV6_T2=2880

# PIO lifetimes matched to DHCPv6 address lifetimes.
CONFIG_DECT_TETHER_IPV6_RA_PIO_PREFERRED_LIFETIME=86400
CONFIG_DECT_TETHER_IPV6_RA_PIO_VALID_LIFETIME=172800
