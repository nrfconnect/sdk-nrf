#
# DHCPv6 tether debugging: log each datagram received on UDP 547 and extra DBG
# lines from dect_tether_ipv6 (e.g. DHCP drops). Merge after prj.conf chain:
#
#   EXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;dhcpv6-debug.conf"
#
# Disable for production (Renew traffic can spam UART).

CONFIG_DECT_TETHER_IPV6_DHCPV6_RX_LOG=y
CONFIG_DECT_TETHER_IPV6_DHCPV6_TRACE=y
CONFIG_DECT_TETHER_IPV6_LOG_LEVEL_DBG=y
