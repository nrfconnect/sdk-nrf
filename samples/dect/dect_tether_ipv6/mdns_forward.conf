#
# Enables CONFIG_DECT_TETHER_IPV6_MDNS_FORWARD only (AF_PACKET IPv6 mDNS
# tap between first Ethernet and dect0; forwards link-scope multicast queries
# to ff02::fb AND unicast mDNS replies to ULA/GUA destinations). Requires
# Ethernet: merge after eth_common.conf and a shield overlay. From the sample directory:
#
#   cd nrf/samples/dect/dect_tether_ipv6
#   west build -p -b nrf9151dk/nrf9151/ns --
#     -DSHIELD=arceli_eth_w5500
#     -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;mdns-common.conf;mdns.conf;eth_mdns.conf;mdns_forward.conf"
#     -DEXTRA_DTC_OVERLAY_FILE=w5500-static-mac.overlay
#
# Requires mdns-common.conf, mdns.conf, and eth_mdns.conf for DNS-SD / mDNS responder.

CONFIG_NET_SOCKETS_PACKET=y
CONFIG_DECT_TETHER_IPV6_MDNS_FORWARD=y
