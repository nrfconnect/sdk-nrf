# Optional: periodic unsolicited NA on host Ethernet (link-local only; ND refresh).
# Append to EXTRA_CONF_FILE, e.g. eth_common.conf;...;eth_unsol_na.conf

CONFIG_DECT_TETHER_IPV6_ETH_UNSOLICITED_NA=y
# NOTE: per RFC 4861 §7.2.5, an unsolicited NA (Solicited flag = 0) never confirms
# reachability, even with Router+Override set -- this is true for any compliant
# stack, not a Windows quirk. Only a solicited NA (reply to a unicast NS probe) or
# upper-layer confirmation (e.g. a TCP ACK) sets a neighbor entry REACHABLE. These
# periodic NAs therefore only refresh the tether gateway's link-layer address in the
# PC's neighbor cache; they do NOT prevent NUD probing. Interval kept at 20 s as an
# ND-table freshness aid.
CONFIG_DECT_TETHER_IPV6_ETH_UNSOLICITED_NA_INTERVAL_MS=20000
