# mDNS / DNS-SD on dect0 for dect_tether_ipv6 (same _dect-nr._udp service as dect_shell).
# Merge after mdns-common.conf. From the sample directory:
#
#   cd nrf/samples/dect/dect_tether_ipv6
#   west build -p -b nrf9151dk/nrf9151/ns --
#     -DEXTRA_CONF_FILE="mdns-common.conf;mdns.conf"
#
# For Ethernet <-> DECT mDNS tap (no NAT), also merge eth_mdns.conf and mdns_forward.conf.

CONFIG_DECT_TETHER_IPV6_SAMPLE_MDNS_DNS_SD=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="dect-tether-ipv6"
CONFIG_NET_HOSTNAME_DYNAMIC=n
CONFIG_NET_HOSTNAME_UNIQUE=n

# Pools: headroom for mDNS bursts on constrained NS RAM.
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=56

# Avoid socket service starving DECT RX under mDNS bursts (see dect_shell prj.conf).
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

# Host leg (Ethernet) + DECT: several IPv6 multicast groups per interface.
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=12
