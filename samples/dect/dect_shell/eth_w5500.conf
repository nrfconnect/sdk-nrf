CONFIG_ETH_W5500=y

# RX alloc wait only (w5500_rx). Keep moderate: the same coop thread also clears
# S0_IR_SENDOK → tx_sem; very large values stall TX-complete vs w5500_tx 10 ms.
CONFIG_ETH_W5500_TIMEOUT=150
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=3072
