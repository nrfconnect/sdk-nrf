#
# Enables dect_shell mDNS sample features on top of prj.conf.
# Use when you want DNS-SD advertisement on dect0 and the ``dect discover`` command.
# Merge after mdns-common.conf. On an Ethernet sink that itself needs to run
# ``dect discover``, also merge eth_sink_mdns-discover.conf on top:
#   eth_common.conf;eth_*.conf;mdns-common.conf;mdns-discover.conf;eth_sink_mdns-discover.conf
#
# From the sample directory:
#   cd nrf/samples/dect/dect_shell
#   west build -p -b nrf9151dk/nrf9151/ns --
#     -DEXTRA_CONF_FILE="mdns-common.conf;mdns-discover.conf"

CONFIG_SAMPLE_DESH_MDNS_DNS_SD_ADVERTISE=y
CONFIG_SAMPLE_DESH_MDNS_DISCOVER=y
