# Seeed W5500 Ethernet Shield add-on for the W5500 driver. Use together with
# eth_w5500.conf and one of the w5500-seeed*.overlay files, e.g.:
#
#   west build -b nrf9151dk/nrf9151/ns <this_sample> --
#     -DSHIELD=seeed_w5500
#     -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;eth_w5500_seeed.conf"
#     -DEXTRA_DTC_OVERLAY_FILE="eth-rx.overlay;w5500-seeed-static-mac.overlay"
#
# The Seeed W5500 Ethernet Shield (Rev 1.01) leaves the W5500 INTn disconnected
# (R25 removed). The w5500-seeed*.overlay files remove int-gpios so the driver
# uses devicetree polling mode. This file tunes the poll period below the TX
# completion timeout. Keep it out of eth_w5500.conf so shields with a wired INTn
# (e.g. Arceli) stay interrupt-driven.
CONFIG_ETH_W5500_POLL_PERIOD=2
