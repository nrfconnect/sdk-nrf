#
# DECT-private RX net_pkt/net_buf pool for dect_shell (sink / FT).
#
# Append last in EXTRA_CONF_FILE, e.g.
#   eth_common.conf;eth_w5500.conf;dect_rx_pool.conf
#
# Why: this sample acts as the sink/FT — DECT RX is the hot path (uplinks
# from many child PTs, plus downlink ACKs). Without isolation, eth0 RX
# bursts allocate from the global RX pools (CONFIG_NET_PKT_RX_COUNT /
# CONFIG_NET_BUF_RX_COUNT) and can starve DECT RX, producing "RX drop:
# packet alloc failed in ISR" cascades. With this overlay, DECT RX uses
# its own slab + buf pool isolated from eth0.
#
# Sized for DECT-RX-prioritized role (matches modem SHMEM RX-heavy split
# in eth_common.conf): generous PKT/BUF counts.
#
# Tune _PKT_COUNT / _BUF_COUNT / _BUF_SIZE if "dect_mdm rx_pool" shows
# MaxUsed == Total under load.
#
# Runtime inspection:
#   desh:~$ dect_mdm rx_pool

CONFIG_DECT_MDM_RX_PRIVATE_POOL=y

# DECT RX prioritized: many concurrent uplinks + downlink ACKs.
CONFIG_DECT_MDM_RX_PRIVATE_PKT_COUNT=30
CONFIG_DECT_MDM_RX_PRIVATE_BUF_COUNT=150
CONFIG_DECT_MDM_RX_PRIVATE_BUF_SIZE=128

# RX pipeline queues (event slab + msgq) sized to PRIVATE_PKT_COUNT + small
# headroom (default 100 is ~3 KB of slack).
CONFIG_DECT_MDM_NRF_RX_EVENT_POOL_COUNT=40
CONFIG_DECT_MDM_NRF_RX_MSGQ_SIZE=40

# Visibility for the "dect_mdm rx_pool" shell:
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y

# Now that we got own pool for dect RX, we can decrease net mem as much as possible
CONFIG_NET_PKT_RX_COUNT=20
CONFIG_NET_BUF_RX_COUNT=60
