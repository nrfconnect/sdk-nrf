#
# Loss-resilient DLC profile for dect_shell (FT / sink side).
#
# Append last in EXTRA_CONF_FILE, e.g.:
#   eth_common.conf;eth_w5500.conf;dect_rx_pool.conf;dlc_resilient.conf
#
# Why: the stock DLC defaults (60 s lifetime, release on first discard)
# don't suit a tether/sink deployment. Applied to the FT's
# default_tx_flow_config[0] (FT->PT return path):
#
#   * SDU lifetime = 2.5 s (NRF_MODEM_DECT_DLC_SDU_LIFETIME_2_5_S = 23):
#     slightly more tolerant than the PT side's 1.5 s, since a dropped
#     return-path ACK forces TCP to retransmit on the already-loaded
#     uplink. Lower for latency-sensitive workloads instead.
#
#   * discard_release_assoc_count = 20: release a stuck PT only after
#     20 consecutive DLC_DISCARD_TIMER_EXPIRED responses (counter resets
#     on successful TX); ~50 s worst case at the lifetime above. 0 = never
#     release. The two sides do NOT need matching values.
#
# Both are runtime-tunable via the DECT L2 shell:
#   desh:~$ dect sett --dlc_sdu_lifetime 23
#   desh:~$ dect sett --dlc_discard_release_assoc_count 20
#   desh:~$ dect sett --read
#
# Valid sdu_lifetime: 1..31 (0.5 ms..60 s) or 255 for INFINITY.

CONFIG_DECT_MDM_NRF_DLC_SDU_LIFETIME=23
CONFIG_DECT_MDM_NRF_DLC_DISCARD_TIMER_RELEASE_ASSOC_COUNT=20
