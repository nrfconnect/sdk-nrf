# Shared Kconfig for DECT shell Ethernet sink builds (link_board_eth and Arceli W5500).
#
# EXTRA_CONF_FILE merge order (omit mDNS layers when not needed):
#   eth_common.conf -> eth_w5500.conf | eth_link_board_eth.conf ->
#   mdns-common.conf -> mdns-discover.conf -> eth_sink_mdns-discover.conf -> optional extras
#
# From the sample directory (Ethernet only, no mDNS):
#   cd nrf/samples/dect/dect_shell
#   west build -p -b nrf9151dk/nrf9151/ns --
#     -DSHIELD=seeed_w5500
#     -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf"
#     -DEXTRA_DTC_OVERLAY_FILE="eth-rx.overlay;w5500-seeed-static-mac.overlay"
#
CONFIG_THREAD_ANALYZER=y

# Usually these overlays are used when acting as FT/sink
CONFIG_DECT_DEFAULT_DEV_TYPE_FT=y
CONFIG_NET_HOSTNAME="dect-eth-sink"
CONFIG_SAMPLE_DESH_AUTO_CONNECT_DEFAULT_ENABLED=y

CONFIG_NET_L2_DECT_BR_IPV6_ETH_UPSTREAM_PREFIX_ROUTE=y
CONFIG_SPI=y

CONFIG_ETH_DRIVER=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y

CONFIG_NET_L2_DECT_MTU=1500

CONFIG_NET_ROUTING=y
CONFIG_NET_L2_DECT_BR_IPV6_ETH_ND_PROXY_PT_NS_UNICAST_INTERCEPT=y

# Optimized for uplink traffic from DECT NR+ PT (=TX) via FT (=RX) to sink Ethernet.
# Keep in sync with eth-rx.overlay (cpuapp_cpucell / cpucell_cpuapp ipc_shm_heap sizes).
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=12288
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=30720

CONFIG_NET_PKT_TX_COUNT=14
CONFIG_NET_BUF_TX_COUNT=28

CONFIG_NET_PKT_RX_COUNT=52
CONFIG_NET_BUF_RX_COUNT=104

CONFIG_NET_STATISTICS_PKT_FILTER=n

# DECT + sink Ethernet: more IPv6 interfaces, addresses, and prefixes than defaults
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
CONFIG_NET_IF_IPV6_PREFIX_COUNT=3

# Decrease neighbor count from desh defaults to have memory for other things
CONFIG_DECT_CLUSTER_MAX_CHILD_ASSOCIATION_COUNT=20
CONFIG_NET_IPV6_MAX_NEIGHBORS=20

# Extra multicast groups on behalf of DECT NR+ PT devices
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=20

# Disable DK library to avoid button/Arduino pin conflicts with shields
CONFIG_DK_LIBRARY=n

# Unicast DNS on upstream Ethernet (eth0). For sink ``dect discover``, merge
# mdns-discover.conf and eth_sink_mdns-discover.conf.
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_SERVER1="2001:4860:4860::8888%eth0"
CONFIG_DNS_SERVER2="2001:4860:4860::8844%eth0"

CONFIG_NET_L2_DECT_LOG_LEVEL_INF=y
CONFIG_LOG_CMDS=y
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y
