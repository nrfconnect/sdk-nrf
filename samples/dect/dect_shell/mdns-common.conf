# mDNS / DNS-SD Kconfig for dect_shell. Optional — merge after :file:`prj.conf`
# (which should enable ``CONFIG_DNS_RESOLVER`` for unicast DNS).
#
# EXTRA_CONF_FILE merge order (omit layers you do not need):
#   eth_common.conf -> eth_w5500.conf | eth_link_board_eth.conf ->
#   mdns-common.conf -> mdns-discover.conf -> eth_sink_mdns-discover.conf -> optional extras
#
# From the sample directory:
#   cd nrf/samples/dect/dect_shell
#   west build -p -b nrf9151dk/nrf9151/ns --
#     -DEXTRA_CONF_FILE="mdns-common.conf;mdns-discover.conf"
#
# Ethernet + mDNS advertisement (Seeed example):
#   -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;mdns-common.conf;mdns-discover.conf"

# mDNS responder + resolver + DNS-SD
CONFIG_DNS_SD=y
CONFIG_MDNS_RESOLVER=y
CONFIG_MDNS_RESPONDER=y
CONFIG_MDNS_RESPONDER_DNS_SD=y

# RFC 6762 §11: mDNS responses (including unicast replies) MUST use IPv6 hop limit 255;
# receivers (e.g. Windows) silently drop unicast mDNS with HL below 255. Zephyr sets
# IPV6_MULTICAST_HOPS=255 on the multicast path but uses CONFIG_NET_INITIAL_HOP_LIMIT
# for unicast reply sockets.
CONFIG_NET_INITIAL_HOP_LIMIT=255

# mDNS uses dns_id 0; extra slots reduce -EAGAIN if resolver overlaps other work.
CONFIG_DNS_NUM_CONCUR_QUERIES=4
CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=4
CONFIG_MDNS_RESOLVER_ADDITIONAL_BUF_CTR=4

# DNS socket dispatcher poll slots (see zephyr/include/zephyr/net/dns_resolve.h):
#   MAX_SERVERS + MDNS_MAX_POLL (+ LLMNR if enabled) + margin
# MDNS_MAX_POLL == NET_IF_MAX_IPV6_COUNT when IPv4 is off. Keep NET_IF_MAX_IPV6_COUNT
# at the real interface count (2 for dect0 + eth0); raise ZVFS_POLL in
# eth_sink_mdns-discover.conf when the sink runs ``dect discover``.
CONFIG_ZVFS_POLL_MAX=10

# Avoid socket service starving DECT RX under mDNS (matches dect_shell prj.conf).
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=4
