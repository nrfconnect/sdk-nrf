# Dual-homed Ethernet sink: mDNS *resolver* on dect0 for ``dect discover``.
# Merge only when the sink itself needs to run ``dect discover`` (not needed
# for advertise-only sinks where the PT discovers the sink).
#
# Required merge order:
#   eth_common.conf -> eth_*.conf -> mdns-common.conf -> mdns-discover.conf ->
#   eth_sink_mdns-discover.conf

# Scoped mDNS resolver on dect0 (unicast Google DNS stay on eth0 in eth_common.conf).
# Order matters: unicast resolvers first, then scoped mDNS — otherwise ordinary names
# hit the mDNS slot first. If .local fails: CONFIG_DNS_RESOLVER_LOG_LEVEL_DBG=y.
CONFIG_DNS_RESOLVER_MAX_SERVERS=3
CONFIG_DNS_SERVER3="[ff02::fb]:5353%dect0"

# Dual-iface mDNS responder + three DNS resolver contexts need more sockets than default.
CONFIG_NET_MAX_CONTEXTS=12

# mdns-common.conf sets CONFIG_ZVFS_POLL_MAX=10; dect0 + eth0 and three scoped DNS
# servers need more dispatcher poll slots or dns_resolve_init returns -EAGAIN.
CONFIG_ZVFS_POLL_MAX=16
