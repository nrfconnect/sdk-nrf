# DECT NR+ RPC sample — default role is client (no DECT modem on this device).
CONFIG_DECT_NR_RPC=y
CONFIG_DECT_NR_RPC_CLIENT=y
CONFIG_DECT_NR_RPC_NET_IF=y
CONFIG_NRF_RPC_UART_TRANSPORT=y
CONFIG_DECT_NR_RPC_UART_TRANSPORT=y

CONFIG_DECT_NR_RPC_CLIENT_IFACE_NAME="dect0"

# UART RPC RX ring (RAM). Use rpc-large-rx.conf (8 KiB) if bursts drop after connect.
CONFIG_NRF_RPC_UART_RX_RINGBUF_SIZE=4096

CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_ZCBOR_BACKUPS=1
CONFIG_NRF_RPC_THREAD_STACK_SIZE=4096
CONFIG_NRF_RPC_THREAD_PRIORITY=0

CONFIG_NRF_RPC_UART_RELIABLE=n
# 250 ms is too short for verbose "dect run sett -r" (many SHELL_LINE events + cmd RSP).
CONFIG_NRF_RPC_RESPONSE_TIMEOUT=400

# Client is follower: do not send group init; wait for server to send it.
CONFIG_NRF_RPC_GROUP_DEFAULT_INITIATOR=n
CONFIG_NRF_RPC_GROUP_INIT_WAIT_TIME=-1

CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV6=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2048
CONFIG_DECT_NR_RPC_CONN_MGR=y
CONFIG_NET_IPV4=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_MAX_CONN=6

CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
CONFIG_NET_IF_MAX_IPV6_COUNT=8
CONFIG_NET_INTERFACE_NAME=y

CONFIG_ZVFS_POLL_MAX=10

CONFIG_NET_BUF=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=8

CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_SHELL_STACK_SIZE=3072

# Optional: server.conf, dns.conf, ping.conf, iperf3-*.conf

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_NRF_RPC_TR_LOG_LEVEL_INF=y
CONFIG_NRF_RPC_LOG_LEVEL_INF=y

CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="dect_rpc_client:~$ "
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
CONFIG_DECT_NR_RPC_CLIENT_SHELL=y

CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_NET_DECT_RPC_LOG_LEVEL_INF=y
