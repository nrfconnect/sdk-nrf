# iperf3 common configuration.
# Build from this directory, e.g.:
#   west build -p -b nrf9151dk/nrf9151/ns -- -DEXTRA_CONF_FILE="iperf3-common.conf;iperf3-tx.conf"
#
# Disables DNS/mDNS and other extras not needed for raw throughput tests.

CONFIG_SAMPLE_DECT_RPC_CLIENT_IPERF3=y

# Throughput: avoid periodic GET_ADDRS on the same UART as IF_SEND; use 8 KiB RX ring.
CONFIG_DECT_NR_RPC_ADDR_SYNC_INTERVAL_SEC=0
CONFIG_NRF_RPC_UART_RX_RINGBUF_SIZE=8192

CONFIG_NRF_RPC_THREAD_POOL_SIZE=5
CONFIG_NRF_RPC_CMD_CTX_POOL_SIZE=12

CONFIG_DNS_RESOLVER=n
CONFIG_DNS_SD=n
CONFIG_DNS_RESOLVER_AUTO_INIT=n
CONFIG_DNS_RESOLVER_CACHE=n
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_MDNS_RESOLVER=n
CONFIG_MDNS_RESPONDER=n
CONFIG_MDNS_RESPONDER_DNS_SD=n
CONFIG_NET_SOCKETS_PACKET=n
CONFIG_NET_SOCKETS_PACKET_DGRAM=n
CONFIG_NET_SOCKETS_INET_RAW=n

CONFIG_NRF_IPERF3_HOST_NAME="nrf-dect-rpc-client-iperf3"
CONFIG_NRF_IPERF3_RESULTS_WAIT_TIME=180
CONFIG_NRF_IPERF3_NONBLOCKING_CLIENT_CHANGES=n

CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=y
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_IF_MAX_IPV6_COUNT=4

CONFIG_NET_TCP=y
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_NET_TCP_INIT_RETRANSMISSION_TIMEOUT=6000
CONFIG_NET_TCP_RETRY_COUNT=6
CONFIG_NET_TCP_ISN_RFC6528=n

CONFIG_POSIX_API=y
CONFIG_GETOPT_LONG=y
CONFIG_CJSON_LIB=y
CONFIG_ZVFS_POLL_MAX=12
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10

CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y

CONFIG_NET_BUF=y
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_TC_RX_COUNT=0

# iperf3 uses libc malloc(); UART RPC TX uses k_malloc per frame (~header + CBOR + payload).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=18432
CONFIG_HEAP_MEM_POOL_SIZE=24576
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=2048
# iperf_main() runs on the shell thread; default 2048 overflows (same as DeSh).
CONFIG_SHELL_STACK_SIZE=9216

CONFIG_SYS_HEAP_RUNTIME_STATS=y

CONFIG_NRF_RPC_TR_LOG_LEVEL_INF=y
CONFIG_NRF_RPC_LOG_LEVEL_WRN=y
CONFIG_NET_DECT_RPC_LOG_LEVEL_WRN=y
