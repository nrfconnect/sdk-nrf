# ICMPv6 ping shell (DECT_ICMP_PING_LIB).
#
# Build: west build ... -- -DEXTRA_CONF_FILE="ping.conf;dns.conf"
#
# Literal IPv6 targets work without dns.conf; hostnames need dns.conf.

CONFIG_GETOPT_LONG=y
CONFIG_DECT_ICMP_PING_LIB=y
CONFIG_DECT_ICMP_PING_DEFAULT_IFACE="dect0"

# getaddrinfo (dest + src) and shell command parsing
CONFIG_HEAP_MEM_POOL_SIZE=3072
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_NET_STATISTICS=y
