# Extra Kconfig fragment: Zephyr net stack debug logging (RPC client).
#
# Build from this sample directory (see README):
#   west build -p -b nrf9151dk/nrf9151/ns -- -DEXTRA_CONF_FILE=debug-net.conf

CONFIG_NET_LOG=y
CONFIG_NET_CORE_LOG_LEVEL_DBG=y
CONFIG_NET_CONN_LOG_LEVEL_DBG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
CONFIG_NET_IPV6_LOG_LEVEL_DBG=y
CONFIG_NET_ICMPV6_LOG_LEVEL_DBG=y
