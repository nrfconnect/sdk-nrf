# DECT NR+ RPC server role. Use with nRF9151 DK, for example:
#   west build -p -b nrf9151dk/nrf9151/ns -- \
#     -DEXTRA_CONF_FILE=server.conf \
#     -DEXTRA_DTC_OVERLAY_FILE=nrf9151-server-modem.overlay

CONFIG_DECT=y

# Usually this RPC server is used when acting as PT
CONFIG_DECT_DEFAULT_DEV_TYPE_PT=y

# Modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT=y
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y
CONFIG_NRF_MODEM_LIB_CFUN_HOOKS=n
CONFIG_NRF_MODEM_LIB_TRACE=n

# DECT NR+ core and RPC server
CONFIG_DECT_NR_RPC=y
CONFIG_DECT_NR_RPC_SERVER=y
CONFIG_DECT_NR_RPC_NET_IF=y
CONFIG_DECT_NR_RPC_SHELL=y

# DECT NR+ driver configuration
CONFIG_DECT_MDM=y
CONFIG_DECT_MDM_DRIVER_NRF=y

CONFIG_DECT_CLUSTER_MAX_CHILD_ASSOCIATION_COUNT=10
CONFIG_NET_IPV6_MAX_NEIGHBORS=10

CONFIG_DECT_MDM_NET_IF_NO_AUTO_START=n
CONFIG_NET_L2_DECT=y
CONFIG_NET_L2_DECT_MGMT=y

# Settings storage (DECT_MDM depends on SETTINGS; NVS backend needs FLASH + NVS)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Modem configuration (align with dect_shell: MODEM_INFO for FW version in dect status)
CONFIG_MODEM_ANTENNA=n
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=n
CONFIG_MODEM_INFO_ADD_SIM=n

# nRF RPC over UART (server is initiator; init in main() after modem)
CONFIG_NRF_RPC_UART_TRANSPORT=y
CONFIG_DECT_NR_RPC_UART_TRANSPORT=y
CONFIG_NRF_RPC_UART_RX_RINGBUF_SIZE=8192
CONFIG_NRF_RPC_GROUP_DEFAULT_INITIATOR=y
CONFIG_NRF_RPC_GROUP_INIT_WAIT_TIME=15000

CONFIG_NRF_RPC_UART_RELIABLE=n
CONFIG_NRF_RPC_RESPONSE_TIMEOUT=50
CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_ZCBOR_BACKUPS=1
CONFIG_NRF_RPC_THREAD_STACK_SIZE=5632
CONFIG_NRF_RPC_THREAD_PRIORITY=0
CONFIG_NRF_RPC_THREAD_POOL_SIZE=5
CONFIG_NRF_RPC_CMD_CTX_POOL_SIZE=12

CONFIG_DECT_NR_RPC_SERVER_EVT_PACING_MS=0

CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_INFO_DEFAULT_DATA_SIZE=208
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=20
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_L2_DUMMY=n
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_NET_L2_DECT_CONN_MGR_AUTO_CONNECT=y
CONFIG_NET_L2_DECT_CONN_MGR_CONNECTION_PERSISTENCE=y

CONFIG_GETOPT_LONG=y
CONFIG_NET_IF_MAX_IPV6_COUNT=4
CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_STATISTICS=y

CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3

CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048

CONFIG_NET_BUF=y
CONFIG_NET_PKT_RX_COUNT=20
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_BUF_POOL_USAGE=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# TF-M configuration
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
CONFIG_TFM_SPM_LOG_LEVEL_INFO=y

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SHELL=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_USE_DEDICATED_WQ=y

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_NRF_RPC_TR_LOG_LEVEL_INF=y
CONFIG_NRF_RPC_LOG_LEVEL_INF=y

CONFIG_DECT_MDM_LOG_LEVEL_INF=y
CONFIG_NET_L2_DECT_LOG_LEVEL_INF=y
CONFIG_NET_L2_DECT_MGMT_LOG_LEVEL_INF=y
CONFIG_NET_L2_DECT_BR_LOG_LEVEL_INF=y
CONFIG_NET_L2_DECT_CONN_MGR_LOG_LEVEL_INF=y

CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="dect_rpc_server:~$ "
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=9216
CONFIG_SHELL_CMD_BUFF_SIZE=4096
CONFIG_SHELL_ARGC_MAX=40
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
CONFIG_NET_SHELL=y

CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_NET_DECT_RPC_LOG_LEVEL_INF=y
