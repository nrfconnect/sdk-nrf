# iperf3 RX configuration (iperf server / downlink-heavy).
# Use after :file:`iperf3-common.conf`.

CONFIG_NRF_IPERF3_HOST_NAME="nrf-dect-rpc-client-iperf3-rx"

CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_PKT_RX_COUNT=22
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32

CONFIG_NET_TCP_RECV_QUEUE_TIMEOUT=10000
