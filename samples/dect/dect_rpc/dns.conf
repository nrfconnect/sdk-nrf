# Unicast DNS resolver (optional). Not needed for literal IPv6 or RPC-only tests.
# Combine with ping.conf for hostname ping.
#
# CONFIG_DNS_SERVER1 must be reachable from dect0 (UDP/53 forwarded over RPC to the
# server DECT iface, then routed on the DECT network). Public resolvers (e.g. Google)
# only work if the DECT parent/BR provides internet routing. In many lab setups, set
# DNS_SERVER1 to your BR/DECT DNS instead. Verify with: net dns <name>

CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="2001:4860:4860::8888"
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000
CONFIG_NET_SOCKETS_DNS_BACKOFF_INTERVAL=4000
