# Enable MCUboot serial recovery over the console UART.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_UART_CONSOLE=n

# Enable flash operations and size MCUboot for the nRF54L15 DK.
CONFIG_FLASH=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_MULTITHREADING=y

# Allow direct uploads to a selected image slot and report image state.
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y
CONFIG_BOOT_ERASE_PROGRESSIVELY=y

# Keep the serial recovery image within the dedicated boot partition.
CONFIG_FPROTECT=n
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
