# On nRF54H20 the firmware loader shares slot1 with the radio image, which
# leaves it only 60 KB. UART logging does not fit in that budget, so it stays
# disabled here while the other targets keep it enabled from prj.conf.
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
