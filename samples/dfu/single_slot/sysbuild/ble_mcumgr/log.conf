# Logging options of the firmware loader image. This file is added by sysbuild.cmake only for
# targets that keep logging enabled, because these options do not exist when LOG is disabled.

# Minimal log mode limits the footprint added to the firmware loader slot.
CONFIG_LOG_MODE_MINIMAL=y

# Only the firmware loader application logs are of interest. The Bluetooth and
# MCUmgr stacks are silenced because their format strings do not fit alongside
# the loader in the firmware loader slot.
CONFIG_LOG_MAX_LEVEL=3
CONFIG_BT_LOG_LEVEL_OFF=y
CONFIG_MCUMGR_LOG_LEVEL_OFF=y
CONFIG_MCUMGR_GRP_IMG_LOG_LEVEL_OFF=y
CONFIG_MCUMGR_GRP_OS_LOG_LEVEL_OFF=y
CONFIG_IMG_MANAGER_LOG_LEVEL_OFF=y
CONFIG_FLASH_LOG_LEVEL_OFF=y
