CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_NRF_GRTC_TIMER=n
CONFIG_CRACEN_IKG=n
# Ineffective here: sysbuild forces FPROTECT=y for MCUboot because
# SB_CONFIG_MCUBOOT_BOOTCONF_LOCK_WRITES is set in firmware updater mode, so this assignment is
# overridden.
# CONFIG_FPROTECT=n
CONFIG_NCS_MCUBOOT_DISABLE_SELF_RWX=y

# Disable run-time CRACEN provisioning of TRNG data.
# KMU slots 248, 249 shall be pre-provisioned while programming with secret TRNG values instead.
CONFIG_CRACEN_PROVISION_PROT_RAM_INV_SLOTS_ON_INIT=n

# Ineffective here: unsatisfied dependency !BOOT_MAX_IMG_SECTORS_AUTO, so BOOT_MAX_IMG_SECTORS stays
# unset and the sector count is calculated automatically.
# CONFIG_BOOT_MAX_IMG_SECTORS=256
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32
