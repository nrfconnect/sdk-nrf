# The default MCUboot is too large to support fprotect.
# To use fprotect disable logs or perform other size optimizations.
# For example, do:
# increase boot_partition size in DTS overlay
# CONFIG_LOG=n
# CONFIG_FPROTECT=y
CONFIG_FPROTECT=n

# Enable boot requests through retained memory.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
