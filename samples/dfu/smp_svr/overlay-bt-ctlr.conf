# Companion of overlay-bt.conf for boards that run the Bluetooth controller in
# the same image. BT_CTLR_DATA_LENGTH_MAX depends on BT_CTLR_DATA_LENGTH, which
# is unavailable when the controller lives on a separate core and is reached
# over HCI IPC (nRF5340 and nRF54H20).
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
