# Serial console is on by default so the reset-button prompt and the
# wake counter are visible out of the box. For the most accurate current
# reading, disable it (see README.rst) -- logging over UART measurably
# raises the current draw.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Required so the console (UART) can actually be suspended around each
# idle window (see main.c) -- without this, the UART peripheral (and
# whatever clock it depends on) stays fully active for the whole "idle"
# window, which dominates the measured current.
CONFIG_PM_DEVICE=y

# Enables the SoC's pm_state_set()/pm_state_exit_post_ops() idle hook
# (soc/nordic/nrf71/soc_power.c), which switches LFXO between Pierce
# and Pixo mode on every idle entry/exit -- required to reliably reach
# the SoC's lowest System ON idle current. The nRF7120 power-state
# devicetree node sets zephyr,pm-device-disabled, so this does not also
# start automatically suspending/resuming the console -- main.c's own
# explicit PM_DEVICE_ACTION_SUSPEND/RESUME calls around each idle window
# are unaffected.
CONFIG_PM=y
