# Sample-specific USB CDC ACM settings.
# USB stack and console routing are provided by the cdc-acm-console snippet on
# nRF54LM20 DK and Dongle. On nRF5340 DK, USB runs on the application core via
# the remote IPC shell (FILE_SUFFIX=usb).

CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Nordic Semiconductor ASA"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Nordic Radio Test sample"
CONFIG_CDC_ACM_SERIAL_VID=0x1915
CONFIG_CDC_ACM_SERIAL_PID=0x54A0

CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y

CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y
