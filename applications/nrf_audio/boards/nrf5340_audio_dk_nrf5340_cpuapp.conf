CONFIG_NRFX_NVMC=y

CONFIG_NRFX_CLOCK=y
CONFIG_AUDIO_SYNC_TIMER_USES_RTC=y

CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_EXFAT=y

CONFIG_NRF_AUDIO_CS47L63_DRIVER=y
CONFIG_NRF_AUDIO_SD_CARD_MODULE=y

# Suppress LOG_ERR messages from sd_check_card_type. Because SPI_SDHC has no card presence method,
# assume card is in slot. Thus error message is always shown if card is not inserted. Kept next to
# the SD stack it belongs to, since this is the only board that builds it.
CONFIG_SD_LOG_LEVEL_OFF=y

CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n
