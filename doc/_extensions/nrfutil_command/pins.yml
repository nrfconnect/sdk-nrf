# Versions of the nrfutil commands that the nrfutil-command directive validates against.
#
# Precedence when resolving the version of a command (later wins):
# 1. ``nrfutil_<command>_ver`` substitutions in doc/nrf/shortcuts.txt (prose only)
# 2. This file (commands not listed under nrfutil.subcommands in tools-versions-*.yml)
# 3. ``nrfutil.subcommands`` in scripts/tools-versions-<os>.yml (for example ``device``)
#
# The documentation build regenerates the json-args snapshot when any of these versions changes.
trace: 6.2.0
mcu-manager: 0.12.2
sdk-manager: 1.16.1
