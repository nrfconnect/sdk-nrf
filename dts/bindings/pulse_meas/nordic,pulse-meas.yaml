description: Nordic nRF pulse width measurement

compatible: "nordic,pulse-meas"

include: base.yaml

properties:

  timer-instance:
    required: true
    type: phandle
    description: TIMER instance used for pulse width capture.

  assert-gpios:
    type: phandle-array
    required: true
    description:
      GPIO for detectiong start of impulse.

  deassert-gpios:
    type: phandle-array
    required: true
    description:
      GPIO for detecting end of impulse.
