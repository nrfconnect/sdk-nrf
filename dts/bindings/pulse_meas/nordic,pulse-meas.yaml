description: Nordic nRF pulse width measurement

compatible: "nordic,pulse-meas"

include: base.yaml

properties:

  timer-instance:
    required: true
    type: phandle
    description: TIMER instance used for pulse width capture.

  assert-gpios:
    type: phandle-array
    required: true
    description:
      GPIO for detecting start of impulse if deassert-gpios is provided. If it is not
      provided (single pin mode), both edges of the pulse are detected on this pin.

  deassert-gpios:
    type: phandle-array
    required: false
    description:
      Optional GPIO for detecting end of impulse. If not provided, the pulse is measured
      on the assert-gpios pin only (single pin mode).
