description: |
  Texas Instruments TAC5112 low-power stereo audio codec.
  The TAC5112 is controlled over I2C (this binding) or SPI (not supported
  by this driver) and carries PCM audio over a TDM/I2S/LJ audio serial
  interface (ASI) wired separately (e.g. to an nRF5-series I2S peripheral).
  The driver supports both ASI target mode, where the host generates BCLK and
  FSYNC, and ASI controller mode, where the codec generates those clocks from
  its PLL.
  Example:
      &i2c0 {
              tac5112: audio-codec@50 {
                      compatible = "ti,tac5112";
                      reg = <0x50>;
                      reset-gpios = <&gpio0 3 GPIO_ACTIVE_LOW>;
                      fault-gpios = <&gpio0 4 GPIO_ACTIVE_LOW>;
                      input-channels = <0x3>;
                      output-channels = <0x3>;
              };
      };
compatible: "ti,tac5112"

include: i2c-device.yaml

properties:
  input-channels:
    type: int
    default: 0x3
    enum:
      - 0x0
      - 0x1
      - 0x2
      - 0x3
      - 0x4
      - 0x5
      - 0x6
      - 0x7
      - 0x8
      - 0x9
      - 0xa
      - 0xb
      - 0xc
      - 0xd
      - 0xe
      - 0xf
    description: |
      Initial bitmask of ADC record (input) channels the driver enables in
      audio_codec_configure(), where bit 0 is channel 1 up to bit 3 for
      channel 4 (valid range 0x0 to 0xf). The default 0x3 enables the two
      stereo channels and is the only configuration presently supported.
      When any input channel is enabled the driver also powers the ADC
      and MICBIAS. Set to 0 to leave the record path disabled. The selection
      can be changed at runtime with tac5112_set_channels().
  output-channels:
    type: int
    default: 0x3
    enum:
      - 0x0
      - 0x1
      - 0x2
      - 0x3
      - 0x4
      - 0x5
      - 0x6
      - 0x7
      - 0x8
      - 0x9
      - 0xa
      - 0xb
      - 0xc
      - 0xd
      - 0xe
      - 0xf
    description: |
      Initial bitmask of DAC playback (output) channels the driver enables
      in audio_codec_configure(), where bit 0 is channel 1 up to bit 3 for
      channel 4 (valid range 0x0 to 0xf). The default 0x3 enables the two
      stereo channels and is the only configuration presently supported.
      The DAC is only powered up on audio_codec_start_output()/start().
      Set to 0 to leave the playback path disabled. The selection can be
      changed at runtime with tac5112_set_channels().
  reset-gpios:
    type: phandle-array
    description: |
      Optional hardware reset line. If present, it is driven inactive
      during driver init to release the codec from reset; software reset
      (SW_RESET register) is used for all subsequent resets regardless of
      whether this property is present.
  fault-gpios:
    type: phandle-array
    description: |
      Optional GPIO wired to a TAC5112 GPIO/GPO/DOUT pin configured (in
      the analog front end / board design) as the chip interrupt (IRQ)
      output. When present, the driver services it from system workqueue
      context and invokes any callback registered via
      audio_codec_register_error_callback(). When absent, applications
      must poll audio_codec_clear_errors() or the DEV_STS0/DEV_STS1
      registers themselves.
